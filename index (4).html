<script>
(function(){
'use strict';
/* =====================================================================
   OLD WEST  -  jogo 2D em pixel art
   ===================================================================== */
const W=480,H=272,T=16;
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
ctx.imageSmoothingEnabled=false;
const FONT='"Press Start 2P", ui-monospace, Menlo, Consolas, monospace';

/* ---------- utilidades ---------- */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hash=(x,y)=>{let h=Math.imul(x|0,374761393)^Math.imul((y|0)+977,668265263);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967295;};
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return [c,x];}
const rc=(c,col,x,y,w,h)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};

/* ---------- áudio ---------- */
let AC=null,NB=null,SFXG=null,MUSG=null,musicOn=true,sfxOn=true;
try{const cf=JSON.parse(localStorage.getItem('oldwest.cfg')||'null');if(cf){musicOn=cf.m!==false;sfxOn=cf.s!==false;}}catch(e){}
function saveCfg(){try{localStorage.setItem('oldwest.cfg',JSON.stringify({m:musicOn,s:sfxOn}));}catch(e){}}
function initAudio(){
  if(AC){if(AC.state==='suspended'){try{AC.resume();}catch(e){}}return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
    const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    SFXG=AC.createGain();SFXG.gain.value=1;SFXG.connect(AC.destination);
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.connect(AC.destination);
    MUSG=AC.createGain();MUSG.gain.value=0.9;MUSG.connect(comp);
  }catch(e){AC=null;}
  if(AC)applyMusic();
}
let SFXPAN=0,SFXVOL=1;
function sfxOut(n){if(SFXPAN&&AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=SFXPAN;n.connect(p);p.connect(SFXG);}else n.connect(SFXG);}
function tone(f,dur,type,vol,slide,delay){
  if(!AC||!sfxOn)return;
  try{
    const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(25,f+slide),t+dur);
    g.gain.setValueAtTime((vol||0.05)*SFXVOL,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);sfxOut(g);o.start(t);o.stop(t+dur+0.03);
  }catch(e){}
}
function noise(dur,vol,lp,delay){
  if(!AC||!sfxOn||!NB)return;
  try{
    const t=AC.currentTime+(delay||0),s=AC.createBufferSource();s.buffer=NB;
    const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=lp||2000;
    const g=AC.createGain();g.gain.setValueAtTime((vol||0.1)*SFXVOL,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);sfxOut(g);s.start(t,Math.random()*0.8);s.stop(t+dur+0.03);
  }catch(e){}
}

  kill(){noise(0.22,0.12,1600);tone(170,0.22,'triangle',0.07,-110);},
  reload(){tone(900,0.04,'square',0.03);tone(650,0.05,'square',0.03,0,0.09);},

  ignite(){noise(0.18,0.08,2500);tone(200,0.15,'sawtooth',0.03,200);},

};

const PAL_P={a:'#000000',b:'#d3c8c8',c:'#fff2f2',d:'#613c09',e:'#7b4e0f',f:'#e4dada',g:'#8c250b',h:'#ff0000',i:'#cd9f5c',j:'#caa46e',k:'#c29554'};

function fromRows(rows,pal){
  const h=rows.length,w=rows[0].length,[c,x]=mk(w,h);
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const col=pal[rows[j][i]];if(col){x.fillStyle=col;x.fillRect(i,j,1,1);}}
  return c;
}
function paintBody(c,rows,r0,r1,test,col){
  const x=c.getContext('2d');x.fillStyle=col;
  for(let j=r0;j<=r1&&j<rows.length;j++)for(let i=0;i<rows[j].length;i++)if(test(rows[j][i]))x.fillRect(i,j,1,1);
}
function scaleUp(c,k){const [n,x]=mk(c.width*k,c.height*k);x.drawImage(c,0,0,c.width*k,c.height*k);return n;}
function whiten(c){const [n,x]=mk(c.width,c.height);x.drawImage(c,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);return n;}
function tint(c,col,a){const [n,x]=mk(c.width,c.height);x.drawImage(c,0,0);x.globalCompositeOperation='source-atop';x.globalAlpha=a;x.fillStyle=col;x.fillRect(0,0,c.width,c.height);return n;}
function flipH(c){const [n,x]=mk(c.width,c.height);x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return n;}
const isBody=ch=>ch==='i'||ch==='j'||ch==='k';

/* Bandana detalhada: dobras, bolinhas, nó e pontas soltas */
function paintBandana(c,P){
  const x=c.getContext('2d');
  const put=(px,py,k)=>{x.fillStyle=P[k];x.fillRect(px,py,1,1);};
  const rows={16:[3,'DHHHHRHHHHHD'],17:[3,'.DRRWRRRWRD.'],18:[3,'..DRRRRRRD..']};
  for(const y in rows){const r=rows[y];for(let i=0;i<r[1].length;i++){const k=r[1][i];if(k!=='.')put(r[0]+i,+y,k);}}
  [[2,16,'H'],[2,17,'R'],[1,16,'K'],[1,17,'D'],[1,18,'R'],[0,18,'K'],[0,19,'R'],[1,19,'D'],[0,20,'D'],[1,20,'R'],[2,18,'K']].forEach(p=>put(p[0],p[1],p[2]));
}

paintBandana(S.bandit,{K:'#2a0a08',R:'#c0261b',D:'#8a1810',H:'#ea5040',W:'#f6ecdc'});
S.banditW=whiten(S.bandit);

/* Dinamiteiro: chapéu verde, cartucheira de dinamite */

(function(){const x=S.dyn.getContext('2d');for(let k=0;k<7;k++){x.fillStyle='#b3171d';x.fillRect(4+k,11+k,2,1);x.fillStyle='#ffd24a';if(k%2===0)x.fillRect(5+k,11+k,1,1);}})();
S.dynW=whiten(S.dyn);

/* Urubu-saco: corpo de saco sem chapéu, bico laranja (as asas são desenhadas em tempo real) */
S.vult=(function(){
  const rows=BAG.slice(9),[c,x]=mk(18,rows.length);
  const pal={a:'#000',i:'#6f5f78',j:'#7d6b86',k:'#5f5068'};
  for(let j=0;j<rows.length;j++)for(let i=0;i<18;i++){const col=pal[rows[j][i]];if(col){x.fillStyle=col;x.fillRect(i,j,1,1);}}
  x.fillStyle='#f2a22b';x.fillRect(15,3,3,2);x.fillStyle='#c97a14';x.fillRect(16,5,2,1);
  return c;
})();

/* Billy Reeves: saco grande (2x), chapéu preto com faixa dourada, lenço vermelho */
(function(){
  const base=fromRows(BAG,Object.assign({},PAL_P,{d:'#121214',e:'#26262b',g:'#7a5a00',h:'#ffcc00',b:'#8c1a1a',c:'#e04040',f:'#b32a2a',i:'#7d5c3c',j:'#8d6844',k:'#6c4e33'}));
  paintBandana(base,{K:'#1a0505',R:'#a8141a',D:'#6a0c10',H:'#d83a3a',W:'#e8d8c0'});
  S.boss=scaleUp(base,2);S.bossW=whiten(S.boss);
})();

/* Alma do xerife (estilo Cuphead): o saco todo azul-claro e translúcido */

/* Coração do HUD (pré-renderizado) */
function mkHeart(fill,hi,out){
  const rows=['.##.##.','#######','#######','.#####.','..###..','...#...'],[c,x]=mk(16,14);
  x.fillStyle=out;
  for(let j=0;j<6;j++)for(let i=0;i<7;i++)if(rows[j][i]==='#'){
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(d=>x.fillRect(1+i*2+d[0],1+j*2+d[1],2,2));
  }
  x.fillStyle=fill;
  for(let j=0;j<6;j++)for(let i=0;i<7;i++)if(rows[j][i]==='#')x.fillRect(1+i*2,1+j*2,2,2);
  if(hi){x.fillStyle=hi;x.fillRect(3,3,2,2);}
  return c;
}
const HEART_ON=mkHeart('#e8322a','#ff9a8a','#1a0805');
const HEART_OFF=mkHeart('#3a2a28',null,'#1a0805');


/* Cartas de vida: cada carta = 2 de vida. A carta rasga em duas etapas (canto, depois ao meio). */
const SUITB=[
 ['.##.##.','#######','#######','#######','.#####.','..###..','...#...'],
 ['...#...','..###..','.#####.','#######','#######','...#...','..###..'],
 ['...#...','..###..','.#####.','#######','.#####.','..###..','...#...']];
const SUITM=[['#.#','###','.#.'],['.#.','###','#.#'],['.#.','###','.#.']];
function mkCardSet(si){
  const CW=15,CH=21,[c,x]=mk(CW,CH),red=si!==1;
  const inside=(px,py)=>px>=0&&py>=0&&px<CW&&py<CH&&!((px===0||px===CW-1)&&(py===0||py===CH-1));
  for(let j=0;j<CH;j++)for(let i=0;i<CW;i++){
    if(!inside(i,j))continue;
    const edge=i===0||j===0||i===CW-1||j===CH-1;
    x.fillStyle=edge?'#1a0f08':((i===1||j===1||i===CW-2||j===CH-2)?'#d9c9a0':'#f6ecd2');x.fillRect(i,j,1,1);
  }
  const suitCol=red?'#c0261b':'#1a1a1e';
  x.fillStyle=suitCol;
  SUITB[si].forEach((r,j)=>{for(let i=0;i<7;i++)if(r[i]==='#')x.fillRect(4+i,7+j,1,1);});
  SUITM[si].forEach((r,j)=>{for(let i=0;i<3;i++)if(r[i]==='#'){x.fillRect(2+i,2+j,1,1);x.fillRect(10+i,16+j,1,1);}});
  x.fillStyle='#fff';x.fillRect(5,8,1,1);
  const jit=k=>Math.round(hash(k,si+7)*2-1);
  const inCorner=(px,py)=>py>=9+(14-px)*1.2+jit(px);
  const inA=(px,py)=>px<=3+py*0.35+jit(py+30);
  function part(src,test,fibers){
    const [n,nx]=mk(CW,CH),sd=src.getContext('2d').getImageData(0,0,CW,CH),od=nx.createImageData(CW,CH);
    for(let j=0;j<CH;j++)for(let i=0;i<CW;i++){
      const k=(j*CW+i)*4;
      if(sd.data[k+3]>0&&test(i,j)){od.data[k]=sd.data[k];od.data[k+1]=sd.data[k+1];od.data[k+2]=sd.data[k+2];od.data[k+3]=255;}
    }
    if(fibers){
      for(let j=0;j<CH;j++)for(let i=0;i<CW;i++){
        const k=(j*CW+i)*4;if(!od.data[k+3])continue;
        const nb=[[1,0],[-1,0],[0,1],[0,-1]].some(d=>{const a=i+d[0],b=j+d[1];if(a<0||b<0||a>=CW||b>=CH)return false;const kk=(b*CW+a)*4;return sd.data[kk+3]>0&&!od.data[kk+3];});
        if(nb){od.data[k]=hash(i,j)>0.5?255:217;od.data[k+1]=hash(i,j)>0.5?255:201;od.data[k+2]=hash(i,j)>0.5?255:160;}
      }
    }
    nx.putImageData(od,0,0);return n;
  }
  const full=c;
  const torn=part(c,(px,py)=>!inCorner(px,py),true);
  const corner=part(c,(px,py)=>inCorner(px,py),true);
  const halfA=part(torn,(px,py)=>inA(px,py),true);
  const halfB=part(torn,(px,py)=>!inA(px,py),true);
  const slot=(()=>{const [n,nx]=mk(CW,CH);for(let j=0;j<CH;j++)for(let i=0;i<CW;i++){if(!inside(i,j))continue;const edge=i===0||j===0||i===CW-1||j===CH-1;if(edge){nx.fillStyle='rgba(0,0,0,0.55)';nx.fillRect(i,j,1,1);}else{nx.fillStyle='rgba(20,10,5,0.35)';nx.fillRect(i,j,1,1);}}return n;})();
  return {full,torn,corner,halfA,halfB,slot};
}
const CARDS=[mkCardSet(0),mkCardSet(1),mkCardSet(2)];

const GLOW=(function(){const [c,x]=mk(64,64);const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,214,120,0.55)');g.addColorStop(0.45,'rgba(255,190,90,0.2)');g.addColorStop(1,'rgba(255,170,60,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return c;})();

/* mato rolante (tumbleweed) */
function mkWeed(r){
  const n=r*2+6,[c,x]=mk(n,n),cols=['#8a5a2b','#5b3a1a','#a9733a'];
  x.translate(n/2,n/2);
  for(let i=0;i<9;i++){x.save();x.rotate(i*Math.PI/9);x.fillStyle=cols[i%3];x.fillRect(-r+(i%2),-1,(r-(i%2))*2,1);x.restore();}
  for(let i=0;i<18;i++){const a=i/18*Math.PI*2,rr=r*(0.8+0.15*hash(i,r));x.fillStyle=cols[i%3];x.fillRect(Math.round(Math.cos(a)*rr)-1,Math.round(Math.sin(a)*rr)-1,2,2);}
  return c;
}

function parseChord(tok){
  const m=/^([A-G])([b#]?)(.*)$/.exec(tok);
  let pc=PCN[m[1]]+(m[2]==='#'?1:(m[2]==='b'?-1:0));pc=(pc+12)%12;
  const q=m[3],qual=q==='m'?'min':(q==='7'?'dom':(q==='m7'?'m7':(q==='dim'?'dim':'maj')));
  return {pc,qual,tones:QUAL[qual].map(x=>(pc+x)%12)};
}
function rng32(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
/* melodia gerada: motivo de 4 compassos que se repete (A A B B), apoiado nos acordes */
function genMelody(tr,chords){
  const r=rng32(tr.seed),sc=SCL[tr.mode].map(x=>(x+PCN[tr.key])%12),cells=CELLS[tr.dens||'normal'];
  const pk=a=>a[Math.floor(r()*a.length)],events=[];
  let cur=Math.round((tr.lo+tr.hi)/2),dir=1;
  for(let b=0;b<chords.length;b++){
    const ch=chords[b],bi=b%8;
    if(tr.repeat!==false&&bi>=4&&bi<=6){events[b]=events[b-4].map(e=>({st:e.st,len:e.len,m:e.m}));continue;}
    const cell=pk(cells),pool=[];
    for(let m=tr.lo;m<=tr.hi;m++){const pc=m%12;if(sc.indexOf(pc)>=0||ch.tones.indexOf(pc)>=0)pool.push(m);}
    const evs=[];
    cell.forEach((c,ci)=>{
      const st=c[0],len=c[1],last=ci===cell.length-1;
      const strong=(st===0||st===4||(len>=2&&st%2===0));
      if(!strong&&r()<0.1)return;
      let m;
      if(strong||(last&&(b%4)===3)){
        const cand=pool.filter(n=>ch.tones.indexOf(n%12)>=0&&Math.abs(n-cur)<=7&&n!==cur);
        cand.sort((x,y)=>Math.abs(x-cur)-Math.abs(y-cur));
        m=cand.length?(r()<0.65?cand[0]:cand[Math.min(1,cand.length-1)]):cur;
      }else{
        let i=pool.indexOf(cur);
        if(i<0){i=0;let bd=99;pool.forEach((n,k)=>{const d=Math.abs(n-cur);if(d<bd){bd=d;i=k;}});}
        if(r()<0.25)dir=-dir;
        if(cur>tr.hi-3)dir=-1;if(cur<tr.lo+3)dir=1;
        i=clamp(i+dir*(r()<0.7?1:2),0,pool.length-1);m=pool[i];
      }
      cur=m;evs.push({st,len,m});
    });
    events[b]=evs;
  }
  const mel={};
  events.forEach((evs,b)=>evs.forEach(e=>{mel[b*8+e.st]={m:e.m,len:e.len};}));
  return mel;
}
const TCACHE={};
function getTrack(name){
  if(TCACHE[name])return TCACHE[name];

  const chords=d.bars.split(' ').map(parseChord);
  const tr=Object.assign({sw:0.64,piano:true,bass:'walk',leadVol:0.075,dens:'normal',repeat:true,rev:0.14},d,{chords,nb:chords.length});
  tr.mel=genMelody(tr,chords);

function disk(x,y,r,col){ctx.fillStyle=col;for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy));ctx.fillRect(Math.round(x-w),Math.round(y+dy),w*2,1);}}
function ridge(cx,par,base,amp,col,hi,seed){
  const bw=8,ox=cx*par,i0=Math.floor(ox/bw),n=Math.ceil(W/bw)+2;

    const i=i0+k,b=Math.floor(i/7),m=((i%7)+7)%7;

    const x=Math.round(i*bw-ox);
    ctx.fillStyle=col;ctx.fillRect(x,base-h,bw,H-(base-h)+40);
    ctx.fillStyle=hi;ctx.fillRect(x,base-h,bw,2);
  }
}
function dunes(cx,par,base,amp,col,hi){

function postsUnder(x,r){

function room(id,w,h,theme,sf){return {id,name:NAMES[id],w,h,theme,sf:sf==null?null:sf,g:Array.from({length:h},()=>Array(w).fill('.')),exits:{},defs:[],decor:null,caves:[],holes:[],fakes:[],props:[]};}
const FL=r=>r.sf!=null?r.sf:r.h-3;
function fl(r,a,b){for(let x=a;x<b;x++)for(let y=FL(r);y<Math.min(r.h,FL(r)+3);y++)r.g[y][x]='#';}
function deep(r){for(let y=FL(r)+3;y<r.h;y++)for(let x=0;x<r.w;x++)r.g[y][x]='R';}
function blk(r,x,y,w,h,ch){for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(y+j>=0&&y+j<r.h&&x+i>=0&&x+i<r.w)r.g[y+j][x+i]=ch;}}
function plat(r,x,y,n){for(let i=0;i<n;i++)if(x+i>=0&&x+i<r.w&&r.g[y][x+i]==='.')r.g[y][x+i]='=';}
function en(r,t,tx,ty,o){r.defs.push(Object.assign({k:'en',t,x:tx*T+8,y:(ty==null?FL(r):ty)*T},o||{}));}
function st(r,t,tx,o){const d=Object.assign({k:'st',t,x:tx*T+8,y:FL(r)*T},o||{});if(o&&o.row!=null)d.y=o.row*T;r.defs.push(d);}
function fake(r,x,y,w,h,id){r.fakes.push({x,y,w,h,id});if(!G.flags.secrets||!G.flags.secrets[id])blk(r,x,y,w,h,'F');else blk(r,x,y,w,h,'.');}
function rr(seed){const f=rng32(seed);return {f,i:(a,b)=>a+Math.floor(f()*(b-a+1)),p:a=>a[Math.floor(f()*a.length)],c:p=>f()<p};}
const nearHole=(r,a,b)=>r.holes.some(h=>h[0]<=b+2&&h[1]>=a-2);
function standRow(r,x,y0){let y=y0;while(y>1&&isSolCh(r.g[y-1][x]))y--;return y;}
function foe(r,x,row,pool,R){

/* superfície: sequência de trechos com subidas de até 3 blocos */
function surf(r,x0,x1,seed,pool,dens){
  const R=rr(seed),s=FL(r);let x=x0;
  while(x<x1-8){
    let k=R.p(['flat','flat','steps','plats','mesa','crates','cacti','high','plats']);
    const span={flat:9,steps:16,plats:15,mesa:16,crates:9,cacti:11,high:12}[k];
    if(x+span>x1||nearHole(r,x,x+span)){
      const w=4;if(R.c(dens*0.5)&&!nearHole(r,x,x+w))foe(r,x+1,null,pool.filter(t=>t!=='weed'),R);x+=w;continue;
    }
    if(k==='flat'){const w=R.i(5,9);if(R.c(dens))foe(r,x+R.i(1,w-2),null,pool,R);if(R.c(0.25))r.props.push(['cactusbg',x+R.i(1,w-1)]);x+=w;}
    else if(k==='steps'){const w=R.i(9,13);blk(r,x,s-2,3,2,'R');blk(r,x+3,s-3,w-6,3,'R');blk(r,x+w-3,s-2,3,2,'R');if(R.c(dens))foe(r,x+(w>>1),s-3,pool.filter(t=>t!=='weed'),R);x+=w+R.i(2,3);}
    else if(k==='mesa'){const w=R.i(6,9);blk(r,x,s-2,2,2,'R');blk(r,x+2,s-5,w,5,'R');blk(r,x+2+w,s-2,2,2,'R');if(R.c(dens))foe(r,x+2+(w>>1),s-5,pool.filter(t=>t!=='weed'&&t!=='vult'),R);x+=w+R.i(5,6);}
    else if(k==='plats'){plat(r,x,s-3,4);plat(r,x+5,s-5,4);plat(r,x+10,s-3,4);if(R.c(dens))foe(r,x+6,s-5,pool.filter(t=>t!=='weed'&&t!=='vult'),R);if(R.c(0.4))en(r,'vult',x+7,s-9,{rng:50});x+=15;}
    else if(k==='crates'){blk(r,x+1,s-2,2,2,'W');blk(r,x+3,s-4,2,4,'W');if(R.c(dens*0.6))foe(r,x+4,s-4,pool.filter(t=>t!=='weed'&&t!=='vult'),R);x+=R.i(7,9);}
    else if(k==='cacti'){st(r,'cactus',x+2);st(r,'cactus',x+R.i(5,7));x+=R.i(9,11);}
    else if(k==='high'){plat(r,x,s-3,4);plat(r,x+3,s-6,4);plat(r,x+7,s-9,4);st(r,'bag',x+8,{row:s-9,id:r.id+'_b'+x,coins:R.i(4,7)});x+=12;}
  }
}
/* túnel subterrâneo: caverna escavada na rocha, com dois poços de acesso */
function cave(r,x0,x1,seed,pool){
  const R=rr(seed),fy=r.h-3,s=FL(r);
  for(let x=x0;x<x1;x++){const top=s+5+Math.floor(hash(x>>2,seed)*3);for(let y=top;y<fy;y++)r.g[y][x]='.';}
  for(let x=x0+9;x<x1-10;x+=R.i(10,15)){const h=R.i(1,2);blk(r,x,fy-h,R.i(2,4),h,'R');}
  shaft(r,x0+1);shaft(r,x1-5);
  for(let x=x0+7;x<x1-10;x+=R.i(9,13)){plat(r,x,fy-4,4);if(R.c(0.5))plat(r,x+2,fy-7,3);}
  for(let x=x0+9;x<x1-9;x+=R.i(7,10)){
    const t=R.p(pool);
    if(t==='vult')en(r,'vult',x,fy-7,{rng:40});
    else{const row=standRow(r,x,fy);en(r,t,x,row,{rng:R.i(14,28)});}
  }
  const mx=(x0+x1)>>1;st(r,'chest',mx,{row:standRow(r,mx,fy),id:r.id+'_c'+x0,coins:R.i(8,14)});
  r.caves.push([x0,x1]);
}
function shaft(r,x){
  const s=FL(r);
  for(let y=s;y<=s+7;y++)for(let i=0;i<4;i++)r.g[y][x+i]='.';
  [r.h-7,r.h-10,r.h-13,r.h-16,r.h-19].forEach((y,k)=>{if(y>s)plat(r,x+(k%2),y,3);});
  r.holes.push([x,x+3]);
}

/* decoração espalhada pelas fases longas */
function scatterDecor(c,r,seed,kinds){
  const g=FL(r)*T,R=rr(seed);
  for(let x=4;x<r.w-4;x+=R.i(5,11)){
    if(nearHole(r,x,x+1))continue;
    const k=R.p(kinds),px=x*T+8;
    if(k==='fence')dFence(c,x*T,g,R.i(2,5));
    else if(k==='tree')dTree(c,px,g,R.i(30,50));
    else if(k==='cactus')dCactus(c,px,g,R.i(20,34));
    else if(k==='boulder')dBoulder(c,x*T,g,R.i(16,26),R.i(10,16),r.theme==='night'?'#50507e':'#a07f68');
    else if(k==='bones')dBones(c,px,g);
    else if(k==='barrel')dBarrel(c,px,g);
    else if(k==='tomb')dTomb(c,px,g,R.i(0,2));
    else if(k==='lamp')dLamp(c,px,g,r.theme==='night'?'#8fb8ff':'#ffd86b',R.i(28,40));
  }
  r.props.forEach(p=>{if(p[0]==='cactusbg')dCactus(c,p[1]*T+8,g,22);});
}
function caveDecor(c,r){
  const s=FL(r);
  if(r.sf==null)return;
  rc(c,'#1a110c',0,(s+1)*T,r.w*T,(r.h-s-1)*T);
  r.caves.forEach(cv=>{
    const x0=cv[0]*T,x1=cv[1]*T,y0=(s+3)*T,y1=r.h*T;

    for(let x=x0+24;x<x1-10;x+=120)dLamp(c,x,(r.h-3)*T-40,'#ffb347',18);
    for(let i=0;i<14;i++){const xx=x0+Math.floor(hash(i,cv[0])*(x1-x0)),yy=y0+Math.floor(hash(i,cv[1])*(y1-y0));rc(c,'#4aa8c8',xx,yy,2,2);}
    for(let x=x0;x<x1;x+=18)rc(c,'#463428',x,(r.h-3)*T-2,12,2);
  });
}

const SPECIALS={estrada:{bats:3},rancho:{bats:2,surf:1},rua:{bats:3,surf:1},deserto:{bats:3,cave:1,surf:1},cemiterio:{bats:2,cave:1,surf:1},trem:{bats:2,cave:1},vale:{bats:3,cave:1,surf:1},fantasma:{bats:2,surf:1},mina:{bats:3,cave:2,any:true},ravina:{surf:2}};
function addSpecials(r){
  const sp=SPECIALS[r.id];if(!sp)return;
  const R=rr(4000+r.w*3+r.h),sfc=FL(r),spots=[];
  const ok=(x,y)=>r.g[y][x]==='.'&&r.g[y-1][x]==='.'&&r.g[y-2][x]==='.'&&(isSolCh(r.g[y+1][x])||(sp.any&&r.g[y+1][x]==='='))&&!nearHole(r,x-1,x+1);
  for(let y=3;y<r.h-1;y++)for(let x=14;x<r.w-4;x++)if(ok(x,y)&&!r.defs.some(d=>d.k==='st'&&Math.abs(d.x/T-x)<4&&Math.abs(d.y/T-(y+1))<3))spots.push([x,y+1]);
  const used=[];
  const take=(list,n,type)=>{for(let i=0;i<n&&list.length;i++){
    for(let tries=0;tries<12;tries++){const p=list[R.i(0,list.length-1)];if(used.some(u=>Math.abs(u-p[0])<(sp.any?6:14)))continue;used.push(p[0]);en(r,type,p[0],p[1],{rng:16});break;}
  }};
  take(spots.filter(p=>p[1]===sfc),sp.surf||0,'armored');
  take(spots.filter(p=>sp.any?p[1]>8:(p[1]>sfc+3&&r.caves.some(cv=>p[0]>=cv[0]&&p[0]<cv[1]))),sp.cave||0,'armored');
  let nb=sp.bats||0;
  for(let tries=0;nb>0&&tries<60;tries++){
    let x;
    if(r.caves.length){const cv=r.caves[R.i(0,r.caves.length-1)];x=R.i(cv[0]+10,cv[1]-12);}else x=R.i(10,r.w-10);
    let y0=sp.any?2:sfc+3;while(y0<r.h-4&&isSolCh(r.g[y0][x]))y0++;
    if(r.g[y0][x]!=='.'||(!sp.any&&y0>sfc+9)||(sp.any&&y0>r.h/2))continue;
    if(r.defs.some(d=>d.k==='en'&&d.t==='bat'&&Math.abs(d.x/T-x)<6&&Math.abs(d.y/T-y0)<6))continue;
    en(r,'bat',x,y0+9/T,{});nb--;
  }
}
Object.keys(SPECIALS).forEach(id=>{const f=ROOMS[id];ROOMS[id]=function(){const r=f();addSpecials(r);return r;};});

/* ---------- física de tiles ---------- */
function solidTile(tx,ty,pl){
  if(ty<0||ty>=R.h)return true;
  if(tx<0)return pl?!R.exits.left:true;
  if(tx>=R.w)return pl?!R.exits.right:true;
  return isSolCh(R.g[ty][tx]);
}
function oneWay(tx,ty){return tx>=0&&tx<R.w&&ty>=0&&ty<R.h&&R.g[ty][tx]==='=';}
function groundAt(x,y){const tx=Math.floor(x/T),ty=Math.floor((y+2)/T);return solidTile(tx,ty,false)||oneWay(tx,ty);}
function clearLine(x0,y0,x1,y1){
  const n=Math.ceil(Math.hypot(x1-x0,y1-y0)/8);
  for(let i=1;i<n;i++){const t=i/n;if(solidTile(Math.floor((x0+(x1-x0)*t)/T),Math.floor((y0+(y1-y0)*t)/T),false))return false;}
  return true;
}
/* corpo: x = centro, y = pés, w/h = caixa */
function bodyMove(b,pl){
  b.x+=b.vx;b.hitWall=false;
  let l=b.x-b.w/2,r=b.x+b.w/2;
  const y0=Math.floor((b.y-b.h)/T),y1=Math.floor((b.y-0.01)/T);
  if(b.vx>0){const tx=Math.floor((r-0.001)/T);for(let ty=y0;ty<=y1;ty++)if(solidTile(tx,ty,pl)){b.x=tx*T-b.w/2-0.001;b.vx=0;b.hitWall=true;break;}}
  else if(b.vx<0){const tx=Math.floor(l/T);for(let ty=y0;ty<=y1;ty++)if(solidTile(tx,ty,pl)){b.x=(tx+1)*T+b.w/2+0.001;b.vx=0;b.hitWall=true;break;}}
  const pb=b.y;b.y+=b.vy;b.onGround=false;
  l=b.x-b.w/2;r=b.x+b.w/2;
  const x0=Math.floor(l/T),x1=Math.floor((r-0.001)/T);
  if(b.vy>=0){
    const ty=Math.floor(b.y/T);
    for(let tx=x0;tx<=x1;tx++){
      if(solidTile(tx,ty,pl)||(!(b.drop>0)&&oneWay(tx,ty)&&pb<=ty*T+0.01)){b.y=ty*T;b.vy=0;b.onGround=true;break;}
    }
  }else{
    const ty=Math.floor((b.y-b.h)/T);
    for(let tx=x0;tx<=x1;tx++)if(solidTile(tx,ty,pl)){b.y=(ty+1)*T+b.h;b.vy=0;break;}
  }
}
const ov=(a,b)=>Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs((a.y-a.h/2)-(b.y-b.h/2))<(a.h+b.h)/2;
const inBox=(px,py,e,r)=>Math.abs(px-e.x)<e.w/2+r&&Math.abs(py-(e.y-e.h/2))<e.h/2+r;

/* ---------- partículas e avisos ---------- */
function burst(x,y,n,cols,spd,grav,life,sz){
  for(let i=0;i<n;i++){
    const a=rnd(Math.PI*2),s=rnd(0.3,spd||2);
    PART.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.8,life:(life||30)*rnd(0.6,1),max:life||30,col:pick(cols),sz:sz||2,grav:grav===undefined?0.1:grav});
  }
}
const crumbs=(x,y,n)=>burst(x,y,n,['#cd9f5c','#caa46e','#c29554','#e6c48a','#000000'],2.6,0.14,40,2);
const spark=(x,y,col)=>burst(x,y,4,[col,'#ffffff'],1.6,0.05,10,1);
function puff(x,y){for(let i=0;i<5;i++)PART.push({x:x+rnd(-5,5),y:y-1,vx:rnd(-0.6,0.6),vy:rnd(-0.5,-0.1),life:18,max:18,col:'#e6c48a',sz:2,grav:0});}
function updateParticles(){
  for(const p of PART){p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=0.98;p.life--;}
  PART=PART.filter(p=>p.life>0);
}
function banner(big,sub,dur,col){G.banner={big,sub,t:0,dur:dur||90,col:col||'#ffe27a'};}

/* ---------- dano ---------- */
function hurtPlayer(d,sx){
  if(P.dead||P.inv>0||P.dashT>0||P.hidden)return;
  const before=P.hp;P.hp-=d;P.inv=110;P.vx=(P.x<sx?-1:1)*2.4;P.vy=-3.2;P.dashT=0;G.hitstop=6;G.shake=7;
  tearCards(before,Math.max(0,P.hp));
  sfx('hurt');crumbs(P.x,P.y-10,12);
  if(P.hp<=0)die();
}
function die(){
  P.dead=true;P.hp=0;G.deadT=0;G.ghost={x:P.x,y:P.y-12,bx:P.x,t:0};
  BUL=BUL.filter(b=>b.own==='p');G.hitstop=14;G.shake=10;sfx('die');stinger('death');crumbs(P.x,P.y-10,20);
}
function explode(x,y,r){
  sfx('boom');G.shake=Math.max(G.shake,8);
  burst(x,y,28,['#ffd24a','#ff8a2a','#e8322a','#3a2a28','#ffffff'],3.4,0.06,34,3);
  if(!P.dead&&Math.hypot(P.x-x,(P.y-9)-y)<r)hurtPlayer(1,x);
  escortBlast(x,y,r);
}
function dmgEnemy(e,d,bx){
  e.hp-=d;e.flash=(e.big||e.t==='boss')?2:4;e.hurtT=150;sfx('hit');
  if(!e.big&&e.t!=='boss')e.vx+=Math.sign(e.x-bx)*0.5;
  if(e.hp<=0&&!e.dead&&e.st!=='dead')killEnemy(e);
}
function killEnemy(e){
  if(G.bank&&e.bankE&&!e.counted){e.counted=true;G.bank.kills++;G.bank.score+=10;}
  if(G.bank&&e.bankBoss){if(e.t==='briggs'&&(e.bars>1||!e.risen)){briggsDeath(e);return;}bankBossDown(e);return;}
  if(e.t==='briggs'){briggsDeath(e);return;}
  if(e.t==='unknown'){unknownDeath(e);return;}
  if(e.t==='boss'){bossDeath(e);return;}
  if(e.t==='jacky'){jackyDeath(e);return;}
  if(e.t==='gghost'){ghostDeath(e);return;}
  if(e.t==='baron'){baronDeath(e);return;}
  e.dead=true;
  if(e.t==='tnt'){explode(e.x,e.y-4,34);return;}
  if(e.kid){G.flags.killed[e.kid]=G.flags.clock||1;if(e.def)RESP.push({d:e.def,kid:e.kid,due:(G.flags.clock||0)+RESPAWN_T});netKill(e.kid);}
  crumbs(e.x,e.y-e.h/2,16);sfx('kill');G.hitstop=3;
  if(!e.noLoot){spawnPK(e.x,e.y-10,'coin',rint(1,2)+(G.flags.owned.horse?1:0));dropLoot(e);if(e.armor)spawnPK(e.x,e.y-12,'pierce',3);if(e.t==='gunman')dropDbl(e);}
}

/* ---------- inimigos ---------- */
const ET={
  bandit:{w:12,h:19,hp:3,dmg:true},
  dyn:{w:12,h:19,hp:4,dmg:false},
  tnt:{w:6,h:8,hp:1,dmg:false},
  vult:{w:16,h:14,hp:2,dmg:true},
  miner:{w:12,h:19,hp:3,dmg:true},
  weed:{w:12,h:12,hp:1,dmg:true},
  boss:{w:28,h:40,hp:90,dmg:true}
};
function mkEn(d){
  const B=ET[d.t];
  return Object.assign({vx:0,vy:0,face:-1,st:'patrol',tm:0,flash:0,dir:Math.random()<0.5?-1:1,home:d.x,homeY:d.y,rng:48,seed:rint(0,999),max:B.hp,dead:false,rot:0,onGround:false,hitWall:false},B,d);
}
function bulletE(x,y,ang,spd,o){
  if(R&&R.storm)stormFlash(x,y);
  BUL.push(Object.assign({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,own:'e',r:2,life:260,col:'#ff5a2a',dead:false},o||{}));
}
function walkerMove(e,spd){
  e.vx=e.dir*spd;
  if(Math.abs(e.x-e.home)>e.rng)e.dir=e.x>e.home?-1:1;
  if(e.onGround&&!groundAt(e.x+e.dir*(e.w/2+4),e.y))e.dir*=-1;
  if(e.hitWall)e.dir*=-1;
}
const AI={};
AI.bandit=function(e){
  e.vy=Math.min(e.vy+0.32,7);
  const dx=P.x-e.x,dy=P.y-e.y,ad=Math.abs(dx);
  if(e.st==='patrol'){
    walkerMove(e,0.45);e.face=e.dir;
    if(!P.dead&&ad<(e.hr||175)&&Math.abs(dy)<(e.vr||46)&&clearLine(e.x,e.y-10,P.x,P.y-10)){e.st='aim';e.tm=0;}
  }else if(e.st==='aim'){
    e.vx=0;e.face=dx>=0?1:-1;e.tm++;
    e.aimA=Math.atan2((P.y-10)-(e.y-10),dx);
    if(e.tm===24){bulletE(e.x+Math.cos(e.aimA)*11,e.y-10+Math.sin(e.aimA)*11,e.aimA,1.9);burst(e.x+Math.cos(e.aimA)*11,e.y-10+Math.sin(e.aimA)*11,3,['#ffd24a','#ffffff'],1.2,0,8,2);sfx('efire');}
    if(e.tm>=38){e.st='cool';e.tm=0;}
  }else{e.vx=0;e.tm++;if(e.tm>60)e.st='patrol';}
  bodyMove(e,false);
};
AI.dyn=function(e){
  e.vy=Math.min(e.vy+0.32,7);
  const dx=P.x-e.x,dy=P.y-e.y,ad=Math.abs(dx);
  if(e.cd>0)e.cd--;
  if(e.st==='throw'){
    e.vx=0;e.face=dx>=0?1:-1;e.tm++;
    if(e.tm===20){const fl=40+Math.min(20,ad/10);EN.push(mkEn({t:'tnt',x:e.x+e.face*8,y:e.y-14,vx:clamp(dx/fl,-3.2,3.2),vy:-0.1*fl-0.4+clamp(dy/fl,-2,1)}));}
    if(e.tm>34){e.st='chase';e.tm=0;e.cd=rint(70,95);}
  }else if(!P.dead&&ad<300&&Math.abs(dy)<(e.vr||140)){
    /* persegue o xerife, mantendo uma distância de arremesso */
    e.st='chase';e.face=dx>=0?1:-1;
    let want=ad>120?e.face:(ad<70?-e.face:0);
    if(want&&e.onGround&&!groundAt(e.x+want*(e.w/2+4),e.y)&&dy<=8)want=0;
    e.vx=want*0.95;
    if(e.hitWall&&e.onGround)e.vy=-5.6;
    if(e.cd<=0&&ad<210&&e.onGround){e.st='throw';e.tm=0;}
  }else{e.st='patrol';walkerMove(e,0.35);e.face=e.dir;}
  bodyMove(e,false);
};
AI.miner=function(e){
  e.vy=Math.min(e.vy+0.32,7);
  const dx=P.x-e.x,dy=P.y-e.y,ad=Math.abs(dx);
  if(e.st==='patrol'){
    walkerMove(e,0.4);e.face=e.dir;
    if(!P.dead&&ad<210&&Math.abs(dy)<130&&clearLine(e.x,e.y-12,P.x,P.y-10)){e.st='aim';e.tm=0;}
  }else if(e.st==='aim'){
    e.vx=0;e.face=dx>=0?1:-1;e.tm++;
    if(e.tm===24){const fl=38;BUL.push({x:e.x+e.face*6,y:e.y-16,vx:clamp(dx/fl,-3.4,3.4),vy:-4.3+clamp(dy/fl,-1.5,1.5),own:'e',r:4,life:200,dead:false,pick:true,rot:0,grav:0.22});sfx('dash');}
    if(e.tm>=40){e.st='cool';e.tm=0;}
  }else{e.vx=0;e.tm++;if(e.tm>50)e.st='patrol';}
  bodyMove(e,false);
};
AI.tnt=function(e){
  e.vy=Math.min(e.vy+0.2,6);e.tm++;e.rot+=e.vx*0.15+0.05;
  const pvx=e.vx;bodyMove(e,false);
  if(e.onGround)e.vx*=0.9;
  if(R.cartMode&&CART&&e.onGround)e.x-=CART.speed;
  if(e.hitWall)e.vx=-pvx*0.4;
  if(e.tm>70||(ov(e,P)&&!P.dead)){e.dead=true;explode(e.x,e.y-4,34);}
};
AI.vult=function(e){
  e.tm++;
  const dx=P.x-e.x,dy=(P.y-10)-(e.y-7);
  if(e.st==='patrol'){
    const tx=e.home+Math.cos((e.tm+e.seed)*0.025)*e.rng,ty=e.homeY+Math.sin((e.tm+e.seed)*0.06)*10;
    const nx=e.x+(tx-e.x)*0.06;e.face=nx>e.x?1:(nx<e.x?-1:e.face);e.x=nx;e.y+=(ty-e.y)*0.06;
    if(!P.dead&&Math.abs(dx)<130&&dy>-20&&dy<150&&e.tm>50){e.st='dive';e.tm=0;e.tx=P.x;e.ty=P.y-8;}
  }else if(e.st==='dive'){
    const a=Math.atan2(e.ty-(e.y-7),e.tx-e.x);e.x+=Math.cos(a)*2.7;e.y+=Math.sin(a)*2.7;e.face=Math.cos(a)>=0?1:-1;
    if(Math.hypot(e.tx-e.x,e.ty-(e.y-7))<6||e.tm>55||solidTile(Math.floor(e.x/T),Math.floor((e.y-7)/T),false)){e.st='retreat';e.tm=0;}
  }else{
    const a=Math.atan2(e.homeY-e.y,e.home-e.x);e.x+=Math.cos(a)*1.5;e.y+=Math.sin(a)*1.5;e.face=Math.cos(a)>=0?1:-1;
    if(Math.hypot(e.home-e.x,e.homeY-e.y)<6){e.st='patrol';e.tm=0;}
  }
  e.x=clamp(e.x,10,R.w*T-10);e.y=clamp(e.y,16,R.h*T-4);
};
AI.weed=function(e){
  e.vy=Math.min(e.vy+0.28,7);
  const dx=P.x-e.x;
  if(Math.abs(dx)<240)e.vx+=Math.sign(dx)*0.05;else e.vx*=0.99;
  e.vx=clamp(e.vx,-1.6,1.6);e.rot+=e.vx*0.15;
  const pvx=e.vx;bodyMove(e,false);
  if(e.hitWall)e.vx=-pvx*0.7;
  if(e.onGround&&Math.random()<0.012)e.vy=-3.2;
};

/* ---------- Billy Reeves ---------- */
function toIdle(e){e.st='idle';e.tm=0;e.vx=0;}
function bossShot(e,hand){
  const ox=e.x+e.face*16,oy=e.y-26+(hand?5:-5),a=Math.atan2((P.y-10)-oy,P.x-ox);
  bulletE(ox,oy,a,e.ph===1?2.5:2.9,{r:2.5});burst(ox,oy,4,['#ffd24a','#ffffff'],1.4,0,8,2);sfx('efire');e.kick=4;e.hand=hand;
}
function bossFan(e,k,off){
  const ox=e.x+e.face*16,oy=e.y-26,base=Math.atan2((P.y-10)-oy,P.x-ox);
  for(let i=0;i<k;i++)bulletE(ox,oy,base+(i-(k-1)/2)*0.2+off,2.6,{r:2.5});
  sfx('efire');sfx('efire');e.kick=5;
}
function bossRing(e,off){
  for(let i=0;i<10;i++)bulletE(e.x,e.y-22,i/10*Math.PI*2+off,1.7,{r:2.5,col:'#ffd24a'});
  sfx('boom');G.shake=4;
}
function bossWaves(e){
  [-1,1].forEach(d=>BUL.push({x:e.x+d*14,y:e.y,vx:d*2.6,vy:0,wave:true,own:'e',life:210,dead:false,r:0}));
  sfx('wave');
}
AI.boss=function(e){
  const dx=P.x-e.x,face=dx>=0?1:-1;
  e.tm++;if(e.kick>0)e.kick--;
  if(!e.ph)e.ph=1;
  const ph=e.hp>e.max*0.66?1:(e.hp>e.max*0.33?2:3);
  if(e.st!=='wait'&&e.st!=='intro'&&e.st!=='dead'&&ph!==e.ph){
    e.ph=ph;
    if(ph>1){banner('','BILLY ESTÁ FURIOSO!',80,'#ff8a5a');G.shake=8;sfx('boom');burst(e.x,e.y-20,18,['#ff8a2a','#ffd24a'],3,0.05,30,3);}
  }
  e.vy=Math.min(e.vy+0.35,8);
  e.aimA=Math.atan2((P.y-10)-(e.y-26),dx);
  switch(e.st){
    case 'wait':e.face=face;break;
    case 'intro':
      e.face=face;
      if(e.tm===78){banner('FOGO!','',50,'#ff5a3c');sfx('fogo');G.shake=6;e.st='idle';e.tm=0;}
      break;
    case 'idle':{
      e.face=face;const ad=Math.abs(dx),want=ad>170?face:(ad<80?-face:0);
      e.vx=want*(0.55+e.ph*0.15);
      if(e.tm>64-e.ph*12){
        const pool=e.ph===1?['burst','burst','jump']:(e.ph===2?['burst','fan','charge','jump']:['fan','charge','slam','ring','burst']);
        let a=pick(pool);if(a===e.last)a=pick(pool);
        e.last=a;e.st=a;e.tm=0;e.vx=0;
      }
      break;}
    case 'burst':{
      e.vx=0;e.face=face;
      const n=e.ph===1?3:4,gap=e.ph===1?18:13;
      if(e.tm>=22&&(e.tm-22)%gap===0&&(e.tm-22)/gap<n)bossShot(e,((e.tm-22)/gap)%2);
      if(e.tm>22+gap*n+16)toIdle(e);
      break;}
    case 'fan':{
      e.vx=0;e.face=face;
      if(e.tm===26)bossFan(e,e.ph===3?7:5,0);
      if(e.ph===3&&e.tm===56)bossFan(e,7,0.14);
      if(e.tm>(e.ph===3?84:64))toIdle(e);
      break;}
    case 'charge':
      if(e.tm<30){e.vx=0;e.face=face;e.cdir=face;if(e.tm%6===0)puff(e.x,e.y);}
      else{
        if(e.tm===30)sfx('dash');
        e.vx=e.cdir*(e.ph===2?3.2:3.9);e.face=e.cdir;if(e.tm%5===0)puff(e.x-e.cdir*10,e.y);
        if(e.hitWall||e.tm>120){e.st='stun';e.tm=0;e.vx=0;G.shake=8;sfx('boom');burst(e.x+e.cdir*14,e.y-20,12,['#e6c48a','#ffffff'],2.5,0.1,26,2);}
      }
      break;
    case 'stun':e.vx=0;if(e.tm>46)toIdle(e);break;
    case 'jump':
      e.face=face;
      if(e.tm===1){e.vy=-7.8;e.vx=(Math.abs(dx)>120?face:-face)*2.3;sfx('jump');}
      if(e.tm>8&&e.onGround){e.vx=0;G.shake=6;puff(e.x,e.y);sfx('land');if(e.ph>=2)bossWaves(e);toIdle(e);}
      break;
    case 'slam':
      e.face=face;
      if(e.tm===1){e.vy=-10.5;e.vx=clamp(dx*0.025,-2.4,2.4);sfx('jump');}
      if(e.tm>14&&e.vy>0)e.vy+=0.5;
      if(e.tm>10&&e.onGround){e.vx=0;G.shake=12;sfx('boom');bossWaves(e);burst(e.x,e.y-4,14,['#e6c48a','#ffffff'],3,0.1,26,3);toIdle(e);}
      break;
    case 'ring':
      e.vx=0;e.face=face;
      if(e.tm===26)bossRing(e,0);
      if(e.tm===58)bossRing(e,Math.PI/10);
      if(e.tm>92)toIdle(e);
      break;
    case 'dead':
      e.vx=0;
      if(e.tm===170&&!G.flags.bossDead)startReward();
      break;
  }
  bodyMove(e,false);
};

/* ---------- projéteis ---------- */
function updateBullets(){
  for(const b of BUL){
    if(b.dead)continue;
    if(b.wave){
      b.x+=b.vx;b.life--;
      if(b.life<=0||b.x<-10||b.x>R.w*T+10)b.dead=true;
      if(!P.dead&&Math.abs(P.x-b.x)<(P.w+12)/2&&P.y>b.y-12&&P.y-P.h<b.y)hurtPlayer(1,b.x);
      continue;
    }
    if(b.homing)homingSteer(b);
    if(b.grav)b.vy+=b.grav;
    if(b.pick)b.rot+=0.35;
    const ox=b.x,oy=b.y;
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.kind==='fire'&&G.t%2===0)PART.push({x:b.x,y:b.y,vx:rnd(-0.2,0.2),vy:rnd(-0.4,0),life:12,max:12,col:pick(['#ff8a2a','#ffd24a']),sz:2,grav:-0.01});
    if(b.life<=0)b.dead=true;
    if(solidTile(Math.floor(b.x/T),Math.floor(b.y/T),false)&&!(b.x<0||b.x>R.w*T)){
      if(b.bounce>0){
        b.bounce--;const hx=solidTile(Math.floor(b.x/T),Math.floor(oy/T),false),hy=solidTile(Math.floor(ox/T),Math.floor(b.y/T),false);
        if(hx)b.vx=-b.vx;if(hy)b.vy=-b.vy;if(!hx&&!hy){b.vx=-b.vx;b.vy=-b.vy;}
        b.x=ox;b.y=oy;spark(b.x,b.y,'#9ff09a');
      }else{b.dead=true;spark(b.x,b.y,b.own==='p'?'#ffe27a':'#ff6a4a');}
    }
    if(b.x<-30||b.x>R.w*T+30||b.y<-30||b.y>R.h*T+30)b.dead=true;
    if(b.dead)continue;
    if(b.own==='p'){
      for(const e of EN){
        if(e.dead)continue;
        if((e.big||e.t==='boss')&&(e.st==='wait'||e.st==='intro'||e.st==='dead'))continue;
        if(e.noHit||e.inv)continue;
        if(b.hit&&b.hit.indexOf(e)>=0)continue;
        if(inBox(b.x,b.y,e,b.r||1.5)){
          hitEnemy(b,e);
          if(b.pierce>0){b.pierce--;(b.hit=b.hit||[]).push(e);b.dmg*=0.8;}else b.dead=true;
          break;
        }
      }
    }else if(!P.dead&&inBox(b.x,b.y,P,b.r||2)){const wasInv=P.inv>0;hurtPlayer(b.big?2:1,b.x);if(b.ice&&!wasInv)iceHit();b.dead=true;}
  }
  BUL=BUL.filter(b=>!b.dead);
}

/* ---------- armas ---------- */
function gunPivot(p){const r=(p.wp==='sg'||p.wp==='dbl')?5:7;return [p.x+(p.ride?4:0)+Math.cos(p.aim)*r,p.y-(p.ride?28:7)+Math.sin(p.aim)*r];}
function fire(){
  const nb0=BUL.length;
  const p=P,w=WP[p.wp],g=GUN[w.gun],a=p.aim,pv=gunPivot(p),ml=g.len-g.px;
  const mx=pv[0]+Math.cos(a)*ml,my=pv[1]+Math.sin(a)*ml;
  /* munição especial: gasta 1 do inventário por tiro */
  let kind='normal';const f=G.flags,sel=f.ammoSel;
  if(SHOTS[sel]){if(f.owned[sel])kind=sel;else f.ammoSel='normal';}
  else if(sel!=='normal'&&f.inv[sel]>0){f.inv[sel]--;kind=sel;if(f.inv[sel]<=0)f.ammoSel='normal';}
  const dm=w.dmg*dmgMul()*({pierce:1.2,bounce:0.9,homing:0.8,spread:0.6}[kind]||1),sp=spreadMul(),spd=speedMul();
  const mk1=(ang,s2,ox,oy,life,pierce)=>BUL.push({x:mx+ox,y:my+oy,vx:Math.cos(ang)*s2*spd,vy:Math.sin(ang)*s2*spd,own:'p',dmg:dm,life:(life||w.life)*(kind==='homing'?1.6:1),r:1.5,dead:false,kind,pierce:kind==='pierce'?(pierce||3):0,bounce:kind==='bounce'?3:0,homing:kind==='homing',hit:null});
  const fl=kind==='fire'?['#ff8a2a','#ffd24a','#ffffff']:(kind==='pierce'?['#9fe8ff','#ffffff']:['#ffd24a','#ff8a2a','#ffffff']);
  if(p.wp==='sg'||p.wp==='dbl'){
    const n=w.pellets+(kind==='spread'?3:0),half=(n-1)/2,spr=w.spread*0.5*Math.pow(0.8,upl('prec'))*(kind==='spread'?1.4:1);
    for(let i=0;i<n;i++)mk1(a+(i-half)/half*spr+rnd(-0.05,0.05)*sp,w.spd+rnd(0,1.6),0,0,w.life+rint(-3,3),2);
    p.vx-=Math.cos(a)*2.4;if(!p.onGround)p.vy-=Math.sin(a)*0.6;
    G.shake=Math.max(G.shake,3);sfx('sg');burst(mx,my,8,fl,2.2,0.02,10,2);
  }else if(p.wp==='sniper'){
    const nb=BUL.length;mk1(a+rnd(-0.01,0.01)*sp,w.spd,0,0);if(kind==='spread'){mk1(a-0.12,w.spd,0,0);mk1(a+0.12,w.spd,0,0);}
    for(let i=nb;i<BUL.length;i++){BUL[i].pierce=Math.max(BUL[i].pierce,5);BUL[i].snipe=true;BUL[i].r=2;}
    p.vx-=Math.cos(a)*1.8;G.shake=Math.max(G.shake,4);sfx('boom');burst(mx,my,10,['#ffd24a','#ffffff','#ff8a2a'],2.6,0.02,12,2);
  }else if(p.wp==='tommy'){
    mk1(a+rnd(-0.08,0.08)*sp,w.spd,0,0);if(kind==='spread'){mk1(a-0.2,w.spd,0,0);mk1(a+0.2,w.spd,0,0);}sfx('tommy');p.vx-=Math.cos(a)*0.25;burst(mx,my,3,fl,1.6,0,6,2);
  }else if(p.wp==='dual'){
    p.alt^=1;const s2=p.alt?3:-3;
    mk1(a+rnd(-0.08,0.08)*sp,w.spd,-Math.sin(a)*s2,Math.cos(a)*s2);if(kind==='spread'){mk1(a-0.2,w.spd,0,0);mk1(a+0.2,w.spd,0,0);}sfx('dual');burst(mx-Math.sin(a)*s2,my+Math.cos(a)*s2,3,fl,1.4,0,8,2);
  }else{
    mk1(a+rnd(-0.05,0.05)*sp,w.spd,0,0);if(kind==='spread'){mk1(a-0.2,w.spd,0,0);mk1(a+0.2,w.spd,0,0);}sfx('rev');burst(mx,my,4,fl,1.5,0,8,2);
  }
  p.ammo[p.wp]--;p.cd=Math.round(w.cd*cdMul());p.kick=3;
  PART.push({x:pv[0],y:pv[1],vx:-Math.cos(a)*0.6,vy:-1.2,life:30,max:30,col:'#e8c050',sz:1,grav:0.15});
  if(p.ammo[p.wp]<=0)p.cd=Math.max(p.cd,10);
  for(let i=nb0;i<BUL.length;i++)netShot(BUL[i]);
}
function startReload(){if(P.reload>0||P.ammo[P.wp]>=magOf(P.wp))return;P.reload=Math.round(WP[P.wp].reload*reloadMul());sfx('reload');}
function setWp(k){if(avail().indexOf(k)<0||P.wp===k)return;P.wp=k;P.reload=0;P.sw=10;sfx('ui');}
function switchWp(d){const a=avail(),i=a.indexOf(P.wp);setWp(a[(i+d+a.length)%a.length]);}

/* ---------- jogador ---------- */
function updatePlayer(){
  const p=P;
  if(p.dead){p.vy=Math.min(p.vy+0.32,7);p.vx*=0.9;bodyMove(p,true);return;}
  if(p.cart&&CART&&CART.phase==='jump'){aimPlayer(p,0);p.vx=0;p.vy=0;p.y=CART_FLOOR+CART.yoff;return;}
  if(p.hidden){hideTick();return;}
  if(p.inv>0)p.inv--;if(p.dashCd>0)p.dashCd--;if(p.cd>0)p.cd--;if(p.sw>0)p.sw--;if(p.sq>0)p.sq--;if(p.drop>0)p.drop--;
  if(p.kick>0)p.kick=Math.max(0,p.kick-0.6);
  const Lk=keys.KeyA||keys.ArrowLeft,Rk=keys.KeyD||keys.ArrowRight,dir=(Rk?1:0)-(Lk?1:0);
  const jumpHeld=keys.Space||keys.KeyW||keys.ArrowUp||keys.KeyZ;
  const jumpPress=pressed.Space||pressed.KeyW||pressed.ArrowUp||pressed.KeyZ;
  aimPlayer(p,dir);
  /* esquiva */
  if((pressed.ShiftLeft||pressed.ShiftRight||pressed.KeyK||pressed.KeyX)&&p.dashCd<=0&&p.dashT<=0&&!G.flags.cuffed){
    p.dashT=12;p.dashCd=36;p.dashDir=dir||p.face;sfx('dash');burst(p.x,p.y-4,6,['#e6b062','#f6d28e'],1.5,0.02,20,2);
  }
  if(p.dashT>0){p.dashT--;p.vx=p.dashDir*4.4;p.vy=0;}
  else{
    p.vx+=(dir*(p.ride?2.4:(p.cart?1.5:(G.flags.cuffed?1.15:1.75)))*(p.slowMul||1)-p.vx)*(p.onGround?0.28:0.16);
    if(Math.abs(p.vx)<0.05&&!dir)p.vx=0;
    p.vy=Math.min(p.vy+0.32,7.5);
  }
  /* pulo, pulo duplo, descer da tábua */
  if(p.onGround){p.coy=6;p.djUsed=false;}else if(p.coy>0)p.coy--;
  const onPlank=p.onGround&&oneWay(Math.floor(p.x/T),Math.floor((p.y+1)/T));
  if(jumpPress&&(keys.KeyS||keys.ArrowDown)&&onPlank){p.drop=10;p.y+=2;p.onGround=false;p.coy=0;p.jb=0;}
  else if(jumpPress)p.jb=7;else if(p.jb>0)p.jb--;
  if(p.jb>0&&p.dashT<=0){
    if(p.coy>0){p.vy=-6;p.coy=0;p.jb=0;p.onGround=false;sfx('jump');puff(p.x,p.y);}
    else if(!p.djUsed&&!G.flags.cuffed){p.vy=-5.5;p.djUsed=true;p.jb=0;sfx('dj');burst(p.x,p.y-2,10,['#bcd6ff','#ffffff'],1.8,0.02,20,2);}
  }
  if(!jumpHeld&&p.vy<-2.4&&p.dashT<=0)p.vy=-2.4;
  /* aparo fantasma: botão direito / L / botão do celular */
  if(!G.flags.cuffed&&!p.cart&&p.parryCd<=0&&p.dashT<=0&&(mouse.rclick||pressed.KeyL))startParry();
  if(p.parryCd>0)p.parryCd--;if(p.parryT>0){p.parryT--;parryScan();}
  /* armas */
  const w=WP[p.wp];
  if(p.reload>0){p.reload--;if(p.reload===0){p.ammo[p.wp]=magOf(p.wp);sfx('reload2');}}
  if(pressed.KeyR)startReload();
  if(pressed.KeyF)cycleAmmo();
  if(mouse.wheel)switchWp(mouse.wheel>0?1:-1);
  if(pressed.Digit4)setWp('sniper');if(pressed.Digit7)setWp('tommy');if(pressed.Digit5)setWp('dbl');if(pressed.Digit6)setWp('gold');
  if(pressed.Digit1)setWp('rev');if(pressed.Digit2)setWp('sg');if(pressed.Digit3)setWp('dual');
  if((mouse.down||keys.KeyJ||TOUCH.shoot)&&!G.flags.cuffed&&!(PVP&&G.t<PVP.start)&&p.cd<=0&&p.reload===0&&p.sw<=0&&p.dashT<=0){
    if(p.ammo[p.wp]>0)fire();else startReload();
  }
  p.pvy=p.vy;const was=p.onGround;
  bodyMove(p,true);
  if(p.onGround&&!was&&p.pvy>2.5){p.sq=8;puff(p.x,p.y);sfx('land');}
  checkSecrets();
  if(p.ride)p.x=clamp(p.x,26,R.w*T-26);

/* ---------- cartas de melhoria antes de cada fase ---------- */
function offerCards(id){
  const first=Object.keys(G.flags.picked).length===0&&id==='estrada';
  const pool=Object.keys(UPS).filter(k=>upl(k)<UPS[k].max);
  let opts=[];
  if(first)opts=['prec','rate','life'];
  else while(opts.length<3&&pool.length)opts.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  if(!opts.length){G.flags.picked[id]=true;return;}
  G.cards={id,opts,sel:1,t:0};
  G.state='cards';sfx('card');
}
function pickCard(k){
  G.flags.up[k]++;G.flags.picked[G.cards.id]=true;
  if(k==='life')P.hp=maxHp();
  if(k==='mag')P.ammo=fullAmmo();
  sfx('pick');banner('CARTA: '+UPS[k].name,'Nível '+G.flags.up[k]+' de '+UPS[k].max,150,'#ffe27a');
  G.cards=null;G.state='play';save();
}
function cardRect(i){return {x:62+i*124,y:62,w:104,h:150};}
function updateCards(){
  const c=G.cards;c.t++;
  if(c.t<48)return;
  if(pressed.KeyA||pressed.ArrowLeft){c.sel=(c.sel+2)%3;sfx('ui');}
  if(pressed.KeyD||pressed.ArrowRight){c.sel=(c.sel+1)%3;sfx('ui');}
  if(pressed.Digit1){c.sel=0;pickCard(c.opts[0]);return;}
  if(pressed.Digit2&&c.opts.length>1){c.sel=1;pickCard(c.opts[1]);return;}
  if(pressed.Digit3&&c.opts.length>2){c.sel=2;pickCard(c.opts[2]);return;}
  for(let i=0;i<c.opts.length;i++){
    const r=cardRect(i);
    if(mouse.x>=r.x&&mouse.x<r.x+r.w&&mouse.y>=r.y-10&&mouse.y<r.y+r.h){if(c.sel!==i){c.sel=i;sfx('ui');}if(mouse.click){pickCard(c.opts[i]);return;}}
  }
  if(pressed.Enter||pressed.Space)pickCard(c.opts[Math.min(c.sel,c.opts.length-1)]);
}

const ammoAvail=k=>k==='normal'||(SHOTS[k]?!!G.flags.owned[k]:G.flags.inv[k]>0);
function cycleAmmo(){
  const f=G.flags,order=AMMO_ORDER.filter(ammoAvail);
  const i=order.indexOf(f.ammoSel);f.ammoSel=order[(i+1)%order.length];sfx('equip');

function updateInv(){
  if(pressed.KeyR||(mouse.click&&inR({x:W-112,y:6,w:78,h:20},mouse.x,mouse.y))){openWardrobe();return;}
  if(pressed.KeyI||pressed.Escape||pressed.Tab||(mouse.click&&inR(closeRect,mouse.x,mouse.y))){G.state='play';sfx('ui');return;}
  if(mouse.click){
    for(const s of invSlots()){
      if(mouse.x>=s.x&&mouse.x<s.x+s.w&&mouse.y>=s.y&&mouse.y<s.y+s.h){
        if(s.kind==='wp'){if(avail().indexOf(s.id)>=0)setWp(s.id);}

function dropLoot(e){

    for(let i=0;i<6;i++){spawnPK(e.x,e.y-24,'pierce',3);spawnPK(e.x,e.y-24,'fire',3);}

function gainPK(p){

  if(!(e.burn>0))sfx('ignite');

}
function hitEnemy(b,e){

  if(e.armor&&!pierces(b)){blockHit(b,e);return;}
  dmgEnemy(e,b.dmg,b.x);

const hittable=e=>!e.dead&&!e.noHit&&!e.inv&&!((e.big||e.t==='boss')&&(e.st==='wait'||e.st==='intro'||e.st==='dead'));
function homingSteer(b){
  let best=null,bd=170;
  for(const e of EN){if(!hittable(e)||e.t==='tnt')continue;const d=Math.hypot(e.x-b.x,(e.y-e.h/2)-b.y);if(d<bd){bd=d;best=e;}}
  if(!best)return;
  const sp=Math.hypot(b.vx,b.vy),cur=Math.atan2(b.vy,b.vx);
  let d=Math.atan2((best.y-best.h/2)-b.y,best.x-b.x)-cur;
  while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;
  const na=cur+clamp(d,-0.09,0.09);b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;
}
function autoTarget(p){
  let best=null,bd=270;
  for(const e of EN){
    if(!hittable(e)||e.ally)continue;
    const ey=e.y-e.h/2,d=Math.hypot(e.x-p.x,ey-(p.y-9));
    if(d<bd&&clearLine(p.x,p.y-9,e.x,ey)){bd=d;best=e;}
  }
  return best;
}
function aimPlayer(p,dir){
  if(TOUCH.on){
    const t=autoTarget(p);p.autoT=t;
    if(t){p.aim=Math.atan2((t.y-t.h/2)-(p.y-(p.ride?28:9)),t.x-p.x);p.face=t.x>=p.x?1:-1;}
    else{if(dir)p.face=dir;p.aim=p.face>0?0:Math.PI;}
  }else{
    const mx=mouse.x+cam.x,my=mouse.y+cam.y;p.autoT=null;
    p.aim=Math.atan2(my-(p.y-(p.ride?28:9)),mx-p.x);p.face=mx>=p.x?1:-1;
  }
}

  const playing=G.state==='play'&&P&&!P.dead&&!G.fade;

function processPeer(p){

    (pr.k||[]).forEach(k=>{r.seenK[k]=1;});(pr.dh||[]).forEach(d=>{r.seenDh[d[0]]=1;});
  }

function drawSniper2(x){
  const R_=(c,a,b,w,h)=>{x.fillStyle=c;x.fillRect(a,b,w,h);};
  const O='#141418',SC='#5c5c66',SCL='#9a9aa6',DM='#2e2e36',MM='#5a5a64',LM='#a4a4b0',WD='#e29a3c',WL='#f8c470',WK='#a8601e',BP='#74747e';

  R_(O,7,0,4,4);R_(SC,8,1,2,2);R_(SCL,8,1,2,1);

  R_(O,8,4,6,4);R_(MM,9,5,4,1);R_(DM,9,6,4,1);
  R_(O,10,7,3,3);R_(LM,11,8,1,1);
  R_(O,14,7,1,2);
  /* telha (madeira embaixo do cano) */
  R_(O,14,6,9,3);R_(WD,15,7,7,1);
  /* coronha */
  R_(O,0,4,9,1);
  R_(O,0,5,1,6);R_(BP,1,5,1,5);
  R_(WL,2,5,7,1);R_(WD,2,6,7,1);R_(O,8,6,1,1);

}

  G.state='dialog';sfx('ui');
}

/* Morcego: pendurado no teto até você chegar perto; depois voa em curvas, morde e se afasta */
AI.bat=function(e){
  e.tm++;
  const cartm=!!(R&&R.cartMode),dx=P.x-e.x,dy=(P.y-11)-(e.y-5),d=Math.hypot(dx,dy)||1;
  if(e.st==='patrol')e.st='hang';
  if(e.st==='hang'){
    e.vx=0;e.vy=0;e.face=dx>=0?1:-1;
    if(!P.dead&&Math.abs(dx)<130&&Math.abs(dy)<170){e.st='fly';e.tm=0;const a=Math.atan2(dy,dx);e.vx=Math.cos(a)*1.6;e.vy=Math.sin(a)*1.6;}
    return;
  }
  const sp=cartm?2.4:2.0;
  if(e.st==='fly'){
    const des=Math.atan2(dy+Math.sin(e.tm*0.17+e.seed)*22,dx);let cur=Math.atan2(e.vy,e.vx),da=des-cur;
    while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
    cur+=clamp(da,-0.075,0.075);e.vx=Math.cos(cur)*sp;e.vy=Math.sin(cur)*sp;
    if(d<11&&!P.dead){e.st='flee';e.tm=0;e.vx=-e.vx*0.6;e.vy=-1.8;}
    else if(!cartm&&e.tm>260){e.st='return';e.tm=0;}
  }else if(e.st==='flee'){
    e.vy=-1.4;
    if(e.tm>36){e.st='fly';e.tm=0;const a=Math.atan2(dy,dx);e.vx=Math.cos(a)*sp;e.vy=Math.sin(a)*sp;}
  }else if(e.st==='return'){
    const a=Math.atan2(e.homeY-e.y,e.home-e.x);e.vx=Math.cos(a)*1.5;e.vy=Math.sin(a)*1.5;
    if(Math.hypot(e.home-e.x,e.homeY-e.y)<5){e.st='hang';e.x=e.home;e.y=e.homeY;e.vx=e.vy=0;return;}
  }
  let nx=e.x+e.vx,ny=e.y+e.vy;
  if(!cartm){
    if(solidTile(Math.floor(nx/T),Math.floor((ny-5)/T),false)){e.vx=-e.vx;e.vy=-e.vy*0.5;nx=e.x;ny=e.y;}
    nx=clamp(nx,10,R.w*T-10);ny=clamp(ny,16,R.h*T-4);
  }else{
    ny=clamp(ny,24,CART_FLOOR+2);
    if(nx<CART_CAM-130){e.dead=true;return;}
    nx=Math.min(nx,CART_CAM+W+260);
  }
  e.face=e.vx>=0?1:-1;e.x=nx;e.y=ny;
};
/* Blindado (pelo jogo): lento, forte, persegue e bate de perto */
AI.armored=function(e){
  e.vy=Math.min(e.vy+0.32,7);
  const dx=P.x-e.x,dy=P.y-e.y,ad=Math.abs(dx);
  if(e.swing>0){e.swing--;if(e.swing===14&&ad<34&&Math.abs(dy)<26&&!P.dead)hurtPlayer(1,e.x);}
  if(!P.dead&&ad<230&&Math.abs(dy)<70){
    e.face=dx>=0?1:-1;e.st='chase';e.vx=e.face*0.55;
    if(e.onGround&&!groundAt(e.x+e.face*10,e.y))e.vx=0;
    if(ad<28&&e.onGround&&!(e.swing>0))e.swing=34;
  }else{walkerMove(e,0.28);e.face=e.dir;e.st='patrol';}
  bodyMove(e,false);
};

/* ---- inimigos da fuga ---- */
AI.cbandit=function(e){
  if(!CART){e.dead=true;return;}
  e.x=cwx(e.wx);e.y=e.ledgeY;e.tm++;
  if(e.x<CART_CAM-60){e.dead=true;return;}
  e.face=P.x>=e.x?1:-1;e.aimA=Math.atan2((P.y-10)-(e.y-10),P.x-e.x);
  if(e.warn>0)e.warn--;
  if(e.x>CART_CAM+40&&e.x<CART_CAM+W-10&&!P.dead){
    const ph=(e.tm+e.seed)%96;
    if(ph===70)e.warn=24;
    if(ph===94){bulletE(e.x+Math.cos(e.aimA)*10,e.y-10+Math.sin(e.aimA)*10,e.aimA,2.2);sfx('efire');}
  }
};
AI.cdyn=function(e){
  if(!CART){e.dead=true;return;}
  e.x=cwx(e.wx);e.y=e.ledgeY;e.tm++;
  if(e.x<CART_CAM-60){e.dead=true;return;}
  e.face=P.x>=e.x?1:-1;
  if(e.warn>0)e.warn--;
  if(e.x>CART_CAM+60&&e.x<CART_CAM+W-30&&!P.dead){
    const ph=(e.tm+e.seed)%130;
    if(ph===90)e.warn=30;
    if(ph===120){
      const dx=P.x-e.x,dy=P.y-e.y,fl=40+Math.min(20,Math.abs(dx)/10);
      EN.push(mkEn({t:'tnt',x:e.x+e.face*8,y:e.y-14,vx:clamp(dx/fl,-3.2,3.2),vy:-0.1*fl-0.4+clamp(dy/fl,-2,1),wave:e.wave}));sfx('dash');
    }
  }
};
/* Blindado que pula da saliência para dentro do carrinho */
AI.carmor=function(e){
  if(!CART){e.dead=true;return;}
  e.tm++;if(e.swing>0)e.swing--;
  if(e.st==='ledge'){
    e.x=cwx(e.wx);e.y=e.ledgeY;e.face=P.x>=e.x?1:-1;
    if(e.x<CART_CAM-60){e.dead=true;return;}
    if(e.x<CART_X+150&&e.x>CART_X+20&&!P.dead){
      const n=38,g=0.3;e.st='jump';e.jt=0;e.g=g;e.jx=(CART_X+rnd(8,22)-e.x)/n;e.vy=(CART_FLOOR-e.y)/n-0.5*g*n;sfx('jump');
    }
  }else if(e.st==='jump'){
    e.jt++;e.x+=e.jx;e.y+=e.vy;e.vy+=e.g;e.face=P.x>=e.x?1:-1;
    if((e.y>=CART_FLOOR&&e.jt>8)||e.jt>70){e.y=CART_FLOOR;e.st='cart';G.shake=Math.max(G.shake,7);puff(e.x,e.y);sfx('land');}
  }else{
    const dx=P.x-e.x;e.face=dx>=0?1:-1;
    if(Math.abs(dx)>18)e.x=clamp(e.x+Math.sign(dx)*0.32,CART_X-24,CART_X+24);e.y=CART_FLOOR+(CART.yoff||0);
    if(Math.abs(dx)<32&&!(e.swing>0))e.swing=34;
    if(e.swing===14&&Math.abs(P.x-e.x)<34&&Math.abs(P.y-e.y)<26&&!P.dead)hurtPlayer(1,e.x);
  }
};
/* Carrinho dos bandidos (não leva dano) e os 2 espingardeiros dentro dele */
AI.ecart=function(e){
  if(!CART){e.dead=true;return;}
  e.tm++;e.y=CART_FLOOR;
  const alive=EN.filter(g=>g.t==='sgun'&&g.cart===e&&!g.dead).length;
  if(e.st==='arrive'){
    const tx=P.x-80+Math.sin(e.tm*0.03)*12;e.x+=(tx-e.x)*0.035;
    if(!alive){e.st='crash';e.tm=0;sfx('boom');banner('','CARRINHO DERRUBADO!',90,'#ffe27a');}
  }
  if(e.st==='crash'){
    e.x-=2.4+e.tm*0.05;e.tilt=Math.min(0.5,(e.tilt||0)+0.012);
    if(e.tm%4===0)burst(e.x,e.y+6,2,['#6a707c','#3a3f48','#ff8a2a'],1.6,0.05,22,2);
    if(e.x<CART_CAM-160)e.dead=true;
  }
};
AI.sgun=function(e){
  const c=e.cart;
  if(!c||c.dead){e.dead=true;return;}
  e.x=c.x+e.off;e.y=CART_FLOOR-2;e.face=1;e.tm++;
  const gx=e.x+8,gy=e.y-10;e.aimA=Math.atan2((P.y-10)-gy,P.x-gx);
  if(e.warn>0)e.warn--;
  if(P.dead)return;
  const ph=(e.tm+e.seed)%132;
  if(ph===92)e.warn=28;
  if(ph===120){
    for(let i=0;i<7;i++)bulletE(gx,gy,e.aimA+(i-3)*0.1+rnd(-0.03,0.03),3.2+rnd(0,0.5),{r:2,life:40,col:'#ffb347'});
    burst(gx,gy,6,['#ffd24a','#ff8a2a','#ffffff'],2,0,10,2);sfx('sg');
  }
};

/* ---------- a fuga: ondas, rampa, salto e queda ---------- */
function startRide(){
  G.cp={room:R.id,x:P.x,y:P.y};save();
  fadeTo(()=>enterRoom('fuga',CART_X,CART_FLOOR));
}
function startCartScene(){
  const cp=G.flags.cartCP||0;
  CART={sx:0,speed:0,t:0,wave:cp,phase:'intro',pt:0,queue:[],ledges:[],ramp:null,land:0,yoff:0,tilt:0,wheel:0,jt:0,lt:0,spawned:false};

const SPX=()=>CART_CAM+W+36;
const qAdd=(C,delay,fn)=>C.queue.push({at:C.t+delay,fn});
function spBat(C,delay,y){qAdd(C,delay,()=>{const b=mkEn({t:'bat',x:SPX()+rnd(0,30),y:y==null?rnd(70,190):y,wave:C.wave});b.st='fly';b.vx=-2.2;b.vy=rnd(-0.4,0.4);EN.push(b);});}
function spLedge(C,delay,type,ly){
  qAdd(C,delay,()=>{
    const wx=C.sx+(SPX()+30-CART_X);
    C.ledges.push({wx,y:ly,w:60});
    const e=mkEn({t:type,x:SPX()+30,y:ly,wave:C.wave,wx,ledgeY:ly});e.st='ledge';e.seed=rint(0,99);EN.push(e);
  });
}
function spEcart(C,delay){
  qAdd(C,delay,()=>{
    const cart=mkEn({t:'ecart',x:CART_CAM-90,y:CART_FLOOR,wave:C.wave});cart.st='arrive';EN.push(cart);
    [-15,15].forEach((off,i)=>{const g=mkEn({t:'sgun',x:cart.x+off,y:CART_FLOOR-2,wave:C.wave,cart,off});g.seed=i*44;g.face=1;EN.push(g);});
    banner('','Espingardeiros atrás de você!',110,'#ff8a5a');sfx('ready');
  });
}
function spSupply(C,n,tape){qAdd(C,24,()=>{spawnPK(P.x+rnd(-8,8),36,'pierce',n);if(tape)spawnPK(P.x+12,36,'tape',1);ftext(P.x,96,'SUPRIMENTOS!','#9fe8ff');sfx('pickup');});}
const WAVES=[
  {name:'ENXAME DE MORCEGOS',build(C){for(let i=0;i<6;i++)spBat(C,i*16);}},
  {name:'EMBOSCADA NAS SALIÊNCIAS',build(C){spLedge(C,10,'cbandit',150);spLedge(C,130,'cbandit',128);spLedge(C,260,'cbandit',152);spBat(C,60);spBat(C,190);spBat(C,300);}},
  {name:'BLINDADOS! MUNIÇÃO PERFURANTE',build(C){spSupply(C,8,1);spLedge(C,40,'carmor',134);spLedge(C,240,'carmor',134);spBat(C,0);spBat(C,60);spBat(C,160);spBat(C,330);}},
  {name:'O CARRINHO DOS SHOTGUNS',build(C){spEcart(C,0);spLedge(C,110,'cdyn',140);spLedge(C,290,'cdyn',130);}},
  {name:'ÚLTIMO ASSALTO',build(C){spSupply(C,8,1);spLedge(C,40,'carmor',134);spLedge(C,100,'cbandit',150);spLedge(C,180,'cdyn',130);spLedge(C,270,'carmor',134);spLedge(C,330,'cbandit',150);spBat(C,0);spBat(C,70);spBat(C,240);spBat(C,340);}}
];
function startWave(n){
  const C=CART;C.wave=n;C.spawned=false;C.queue=[];
  banner('ONDA '+n+' DE 5',WAVES[n-1].name,120,'#ffb347');sfx('ready');
  WAVES[n-1].build(C);C.spawned=true;
}
const aliveWave=()=>EN.filter(e=>e.wave===CART.wave&&!e.dead&&e.t!=='tnt'&&e.t!=='ecart').length;
function runQueue(){const C=CART;for(let i=C.queue.length-1;i>=0;i--){const q=C.queue[i];if(C.t>=q.at){C.queue.splice(i,1);q.fn();}}}
function waveCleared(){
  const C=CART;banner('ONDA '+C.wave+' CONCLUÍDA','',100,'#9fe8a0');sfx('save');
  if(C.wave===2||C.wave===4){G.flags.cartCP=C.wave;save();ftext(CART_X,120,'CHECKPOINT','#9fe8ff');}
  if(C.wave%2===0&&P.hp<maxHp())spawnPK(P.x+rnd(-8,8),36,'tape',1);
}
/* se faltar munição perfurante com blindados vivos, cai uma caixa (evita ficar preso) */
function helpAmmo(){
  const C=CART;if(C.t%300!==0)return;
  if(EN.some(e=>e.armor&&!e.dead&&e.wave===C.wave)&&G.flags.inv.pierce<4&&P.wp!=='sniper'){spawnPK(P.x+rnd(-8,8),36,'pierce',8);ftext(P.x,100,'MUNIÇÃO PERFURANTE!','#9fe8ff');sfx('pickup');}
}
function beginRamp(){const C=CART;C.phase='ramp';C.ramp={wx:C.sx+620};banner('AGUENTA FIRME!','A ravina vem aí!',140,'#ff8a5a');sfx('boom');}
function landCart(){
  const C=CART;C.phase='landed';C.lt=0;C.yoff=0;C.tilt=0;C.speed=4.2;G.shake=16;sfx('boom');sfx('kill');
  for(let i=0;i<30;i++)PART.push({x:CART_X+rnd(-24,24),y:CART_FLOOR+rnd(-6,10),vx:rnd(-3,3),vy:rnd(-4.5,-1),life:rint(30,60),max:60,col:pick(['#6a707c','#3a3f48','#8a5a3a','#9aa2b0','#5b3a1a']),sz:rint(2,4),grav:0.18});
  P.cart=false;P.vx=2.4;P.vy=-3.6;P.onGround=false;P.inv=80;C.wreck=true;
  banner('FUGA CONCLUÍDA!','O carrinho se despedaçou do outro lado...',170,'#ffe27a');stinger('victory');
  G.flags.cartDone=true;G.flags.cartCP=0;save();
}
function updateCartScene(){
  const C=CART;if(!C||!R.cartMode)return;
  C.t++;
  if(C.phase==='intro'){
    C.speed=Math.min(2.4,C.speed+0.03);
    if(C.t>100){C.phase='wave';startWave(C.wave+1);}
  }else if(C.phase==='wave'){
    C.speed=2.4;runQueue();
    if(C.spawned&&!C.queue.length&&aliveWave()===0){C.phase='between';C.pt=0;waveCleared();}
    helpAmmo();
  }else if(C.phase==='between'){
    C.speed=2.4;C.pt++;
    if(C.pt>110){if(C.wave>=5)beginRamp();else{C.phase='wave';startWave(C.wave+1);}}
  }else if(C.phase==='ramp'){
    C.speed=Math.min(4.6,C.speed+0.02);
    if(C.sx>=C.ramp.wx-10){C.phase='jump';C.jt=0;C.land=C.sx+300;C.speed=5;sfx('jump');BUL=BUL.filter(b=>b.own==='p');}
  }else if(C.phase==='jump'){
    C.jt++;C.speed=5;
    C.yoff=-4*C.jt+0.5*0.13333*C.jt*C.jt;C.tilt=-0.2*Math.cos(C.jt/60*Math.PI);
    if(C.jt>=60)landCart();
  }else if(C.phase==='landed'){
    C.lt++;C.speed=Math.max(0,C.speed*0.9);
    if(C.lt>170&&!G.fade){const dest=ROOMS.ravina();fadeTo(()=>enterRoom('ravina',4*T,FL(dest)*T,1));}
  }
  C.sx+=C.speed;C.wheel+=C.speed*0.2;
  C.ledges=C.ledges.filter(L=>cwx(L.wx)>CART_CAM-90);
  if(P.cart)P.x=clamp(P.x,CART_X-24,CART_X+24);
}

/* cenário da fuga (em coordenadas da sala; a câmera fica parada em x=240) */
function drawCartWorld(){
  const C=CART,sx=C.sx,x0=CART_CAM,x1=CART_CAM+W,w0=sx-CART_X+x0,w1=sx-CART_X+x1;
  /* teto: vigas e lampiões */

  for(let k=Math.floor((w0-80)/150);k<=Math.ceil((w1+80)/150);k++){
    const x=cwx(k*150);rc(ctx,'#3b2514',x-36,22,72,9);rc(ctx,'#241509',x-36,29,72,2);rc(ctx,'#4a2e18',x-36,22,72,1);
    const lx=cwx(k*150+75);rc(ctx,'#2a1a0e',lx,31,1,12);rc(ctx,'#ffd86b',lx-3,43,7,6);rc(ctx,'#2a1a0e',lx-4,42,9,1);glowAt(ctx,lx,46,34,0.55);
  }
  /* saliências suspensas por correntes */
  for(const L of C.ledges){
    const x=cwx(L.wx);if(x<x0-70||x>x1+70)continue;const a=Math.round(x-L.w/2);
    rc(ctx,'#6a6a72',a+6,30,2,L.y-30);rc(ctx,'#6a6a72',a+L.w-8,30,2,L.y-30);
    rc(ctx,'#241810',a,L.y,L.w,10);rc(ctx,'#6a5444',a,L.y,L.w,2);rc(ctx,'#14100c',a+4,L.y+10,L.w-8,5);
    for(let i=0;i<4;i++)rc(ctx,'#8a7058',a+6+i*14,L.y+4,3,1);
  }
  /* chão: a ravina entre a rampa e o outro lado */
  const R0=C.ramp?C.ramp.wx:1e9,LD=C.land||1e9;
  const seg=(a,b,fn)=>{const A=Math.max(a,w0-40),B=Math.min(b,w1+40);if(B>A)fn(cwx(A),cwx(B));};
  const ground=(xa,xb)=>{rc(ctx,'#17100c',xa,RAIL_Y+8,xb-xa,H-RAIL_Y);rc(ctx,'#241810',xa,RAIL_Y+8,xb-xa,3);};
  seg(-1e9,R0,ground);seg(LD,1e9,ground);
  /* ravina */
  if(C.ramp){
    seg(R0,LD,(xa,xb)=>{

/* ---------- inimigos voltam depois de 1 minuto (chefes nunca voltam) ---------- */
function updateRespawn(){
  if(G.t%20!==0||!RESP.length)return;
  const now=G.flags.clock||0;
  for(let i=RESP.length-1;i>=0;i--){
    const r=RESP[i];if(now<r.due)continue;
    const d=r.d,far=Math.abs(d.x-P.x)>240||Math.abs(d.y-P.y)>180;
    const onScr=d.x>cam.x-40&&d.x<cam.x+W+40&&d.y>cam.y-40&&d.y<cam.y+H+70;

      RESP.splice(i,1);
    }
  }
}

function startParry(){P.parryT=14;P.parryCd=52;P.parryHit=false;sfx('parry');}
function reflectBullet(b){
  let tgt=null,bd=1e9;
  for(const e of EN){
    if(e.dead||e.noHit||e.t==='tnt'||e.t==='ecart')continue;
    const d=Math.hypot(e.x-P.x,(e.y-e.h/2)-(P.y-10));
    if(d<bd&&d<340){bd=d;tgt=e;}
  }
  const a=tgt?Math.atan2((tgt.y-tgt.h/2)-b.y,tgt.x-b.x):Math.atan2(-b.vy,-b.vx);
  const sp=Math.max(3.8,Math.hypot(b.vx,b.vy)*1.35);
  b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;b.own='p';b.kind='parry';b.dmg=2.6;b.pierce=3;b.r=3;b.life=100;b.hit=[];b.grav=0;b.homing=0;b.big=false;b.wave=false;
  burst(b.x,b.y,10,['#9fe8ff','#ffffff','#4cb8ff'],2.4,0.01,22,2);
}
function parryScan(){
  const hx=P.x+P.face*9,hy=P.y-14;let got=0;
  for(const b of BUL){
    if(b.dead||b.own==='p')continue;
    if(Math.hypot(b.x-hx,b.y-hy)<26+(b.r||2)){reflectBullet(b);got++;}
  }
  for(const e of EN){
    if(e.t==='tnt'&&!e.dead&&Math.hypot(e.x-hx,(e.y-6)-hy)<28){e.vx=-e.vx*1.5||P.face*2.5;e.vy=-3.4;e.tm=Math.min(e.tm,20);got++;}
  }
  if(got&&!P.parryHit){
    P.parryHit=true;P.inv=Math.max(P.inv,26);G.hitstop=6;G.shake=Math.max(G.shake,3);P.parryCd=18;
    P.ammo[P.wp]=Math.min(magOf(P.wp),P.ammo[P.wp]+1);
    ftext(P.x,P.y-32,'APARO!','#9fe8ff');sfx('parryhit');
    for(let i=0;i<14;i++){const a=i/14*Math.PI*2;PART.push({x:P.x+Math.cos(a)*10,y:P.y-12+Math.sin(a)*10,vx:Math.cos(a)*2.2,vy:Math.sin(a)*2.2,life:20,max:20,col:'#9fe8ff',sz:2,grav:0});}
  }
}

function startCine(steps,o){G.state='cine';G.hint=null;G.cine=Object.assign({steps,i:0,t:0,n:0,tick:null,draw:null,black:0,cam:true,mute:false,flash:0},o||{});}

  const c=G.cine;if(!c){G.state='play';return;}

  if(c.cam)updateCam();
  updateParticles();updateHudFx();
  const s=c.steps[c.i];if(!s){endCine();return;}
  if(s.say!==undefined){

  }else if(s.wait!==undefined){if(c.t>=s.wait)cineNext(c);}
  else if(s.until){if(s.until(c))cineNext(c);}
  else if(s.fn){s.fn(c);if(G.cine===c&&c.steps[c.i]===s)cineNext(c);}

/* ---------- a tempestade de areia: névoa, lampiões, marcas na visão e pistas sonoras ---------- */
const STORM={c:null,x:null,marks:[],flashes:[],streaks:[],hp:6};
function stormInit(){
  if(!STORM.c){const [c,x]=mk(W,H);STORM.c=c;STORM.x=x;}
  STORM.marks=[];STORM.flashes=[];STORM.hp=P?P.hp:6;
  STORM.streaks=Array.from({length:70},()=>({x:rnd(0,W),y:rnd(0,H),l:rnd(8,26),v:rnd(5,11),a:rnd(0.1,0.32)}));
}
function stormFlash(x,y){STORM.flashes.push({x,y,t:10});}
function sfxAt(name,x,vol){
  const dx=x-P.x;SFXPAN=clamp(dx/200,-1,1);SFXVOL=vol===undefined?clamp(1-Math.abs(dx)/330,0.12,1):vol;
  STORM.sfxN=(STORM.sfxN||0)+1;STORM.lastPan=SFXPAN;sfx(name);SFXPAN=0;SFXVOL=1;
}
function updateStorm(){
  if(!R||!R.storm)return;
  const S_=STORM;if(!S_.c)stormInit();
  for(const f of S_.flashes)f.t--;S_.flashes=S_.flashes.filter(f=>f.t>0);
  if(G.t%80===0&&S_.marks.length<7)S_.marks.push({x:rnd(30,W-30),y:rnd(24,H-30),w:rnd(26,70),h:rnd(8,18),rot:rnd(-0.5,0.5),age:0,life:rint(520,860)});
  if(P.hp<S_.hp){for(let i=0;i<2;i++)S_.marks.push({x:rnd(30,W-30),y:rnd(24,H-30),w:rnd(40,90),h:rnd(10,22),rot:rnd(-0.5,0.5),age:0,life:rint(600,900)});sfx('wind');}
  S_.hp=P.hp;
  for(const m of S_.marks)m.age++;S_.marks=S_.marks.filter(m=>m.age<m.life);
  /* ouvir os inimigos: passos e esporas em volta, mais forte quanto mais perto */
  for(const e of EN){
    if(e.dead||e.ally||e.t==='tnt'||e.noHit)continue;
    const d=Math.abs(e.x-P.x);if(d>300||d<80)continue;
    e.stepT=(e.stepT||rint(5,25))-1;
    if(e.stepT<=0&&Math.abs(e.vx)>0.15){sfxAt(R.stormMode==='snow'?'crunch':'step',e.x);e.stepT=rint(16,26);}
  }
}
function holeAt(x,px,py,r,a){
  const g=x.createRadialGradient(px,py,r*0.1,px,py,r);
  g.addColorStop(0,'rgba(0,0,0,'+a+')');g.addColorStop(0.55,'rgba(0,0,0,'+(a*0.82)+')');g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(px-r,py-r,r*2,r*2);
}
function drawStormFog(){
  const S_=STORM;if(!S_.c)stormInit();
  const x=S_.x,cx=clamp(Math.round(cam.x),0,Math.max(0,R.w*T-W)),cy=clamp(Math.round(cam.y),0,Math.max(0,R.h*T-H));
  x.globalCompositeOperation='source-over';x.clearRect(0,0,W,H);
  x.fillStyle=R.stormMode==='snow'?'rgba(206,222,238,0.955)':'rgba(170,122,68,0.955)';x.fillRect(0,0,W,H);
  x.globalCompositeOperation='destination-out';
  holeAt(x,Math.round(P.x-cx),Math.round(P.y-12-cy),84,1);                      /* visão curta ao redor do xerife */
  for(const s of ST){
    if(s.t==='lamp')holeAt(x,Math.round(s.x-cx),Math.round(s.y-30-cy),78,0.96);
    else if(s.t==='fire')holeAt(x,Math.round(s.x-cx),Math.round(s.y-10-cy),96,0.98);
  }
  for(const f of S_.flashes)holeAt(x,Math.round(f.x-cx),Math.round(f.y-cy),46,f.t/10);   /* clarão dos tiros */
  x.globalCompositeOperation='source-over';
  ctx.drawImage(S_.c,0,0);
  /* brilho quente dos lampiões */
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const s of ST){
    if(s.t!=='lamp')continue;const px=s.x-cx,py=s.y-30-cy;if(px<-90||px>W+90)continue;
    glowAt(ctx,px,py,52,0.5+Math.sin(G.t*0.15+s.t0)*0.08);
  }
  ctx.restore();
  /* vento: riscos de areia correndo */
  const sn=R.stormMode==='snow';ctx.fillStyle=sn?'#ffffff':'#f0d9a0';
  for(const s of S_.streaks){
    if(sn){s.x+=s.v*0.5;s.y+=s.v*0.45;if(s.x>W+10||s.y>H+10){s.x=rnd(-20,W);s.y=-6;}ctx.globalAlpha=Math.min(0.9,s.a*2.2);ctx.fillRect(Math.round(s.x),Math.round(s.y),2,2);}
    else{s.x+=s.v;if(s.x>W+30){s.x=-30;s.y=rnd(0,H);}ctx.globalAlpha=s.a;ctx.fillRect(Math.round(s.x),Math.round(s.y),Math.round(s.l),1);}
  }
  ctx.globalAlpha=1;
  /* marcas de areia que ficam na visão e atrapalham */
  for(const m of S_.marks){
    const a=Math.min(1,m.age/60,(m.life-m.age)/150)*0.55;if(a<=0)continue;
    ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.rot);ctx.globalAlpha=a;ctx.fillStyle=sn?'#d6e6f6':'#8a5e30';
    ctx.fillRect(-m.w/2,-m.h/2,m.w,m.h);ctx.fillRect(-m.w/2-6,-m.h/4,m.w+12,m.h/2);ctx.fillStyle=sn?'#ffffff':'#b88a52';ctx.fillRect(-m.w/2+4,-m.h/2,m.w-10,2);ctx.restore();
  }
  ctx.globalAlpha=1;
  /* bordas escurecidas e granuladas */
  const g=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.85);g.addColorStop(0,'rgba(60,34,12,0)');g.addColorStop(1,sn?'rgba(70,100,140,0.45)':'rgba(60,34,12,0.5)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

/* ---------- a carroça coberta (arte de referência) ---------- */
S.wagon=(function(){
  const [c,x]=mk(80,54),OL='#2a1a0e';
  for(let y=2;y<=26;y++){
    const u=(26-y)/24,hw=Math.round(31*Math.sqrt(Math.max(0,1-Math.pow(u,2.4))));
    for(let xx=36-hw;xx<=36+hw;xx++){
      const shade=(xx<20||y>21)?'#dcb878':'#f2dca4';
      rc(x,shade,xx,y,1,1);
      if(xx===36-hw||xx===36+hw||y===2)rc(x,OL,xx,y,1,1);
    }

/* ---------- revólver dourado (arte de referência: ouro com cabo preto) ---------- */

  const [c,x]=mk(17,12),O='#0e1014',ST='#3a3f4a',SL='#6a7482',SH='#98a2b2',GO='#d9a63a',GL='#f6d56e',GD='#8a6414';

  rc(x,O,3,0,7,8);rc(x,GO,4,1,5,6);rc(x,GL,4,1,5,1);rc(x,GD,5,2,1,4);rc(x,GD,7,2,1,4);rc(x,GL,6,3,1,1);rc(x,GL,6,5,1,1);
  /* cano de aço com gravuras douradas */
  rc(x,O,9,2,8,5);rc(x,ST,10,3,6,3);rc(x,SL,10,3,6,1);
  [[11,3],[13,3],[15,3],[12,4],[14,4],[11,5],[13,5],[15,5]].forEach(p=>rc(x,GO,p[0],p[1],1,1));
  [[12,3],[14,5]].forEach(p=>rc(x,GL,p[0],p[1],1,1));
  rc(x,O,16,3,1,3);
  /* armação e cão */
  rc(x,O,1,6,9,3);rc(x,ST,2,6,7,2);rc(x,SL,2,6,7,1);rc(x,SH,3,6,2,1);
  rc(x,O,1,1,2,4);rc(x,SL,1,1,1,1);
  /* guarda-mato em anel e gatilho */
  rc(x,O,4,8,5,4);x.clearRect(5,9,3,2);rc(x,ST,4,9,1,2);rc(x,ST,8,9,1,2);rc(x,ST,5,11,3,1);rc(x,SH,6,8,1,2);
  /* cabo de madeira com veios */
  rc(x,O,0,7,5,5);rc(x,'#7a4528',1,8,3,3);rc(x,'#a05e38',1,8,1,3);rc(x,'#3e2014',2,9,1,2);rc(x,'#3e2014',3,8,1,1);rc(x,'#3e2014',3,10,1,1);rc(x,'#5a3018',2,8,1,1);
  /* a mão do xerife */
  rc(x,'#1a1008',0,9,3,3);rc(x,'#d8b274',0,9,2,2);rc(x,'#f0cf94',0,9,2,1);
  GUN.gold={img:c,px:6,py:4,len:17};
})();

/* ---------- roda de armas: segure Q (toque rápido em Q continua trocando de arma) ---------- */
const WHEEL_W=['rev','sg','dual','sniper','tommy','dbl','gold'];
function wheelIcon(k,cx,cy,maxW,a){
  const img=k==='tommy'?GUN.tommy.img:k==='rev'?GUN.rev.img:(k==='sg'?GUN.sg.img:(k==='sniper'?S.sniperSmall:(k==='dbl'?GUN.dbl.img:(k==='gold'?GUN.gold.img:null))));
  ctx.save();ctx.globalAlpha=a;
  if(k==='dual'){const w=Math.round(GUN.rev.img.width*1.4),h=Math.round(GUN.rev.img.height*1.4);ctx.drawImage(GUN.rev.img,Math.round(cx-w/2),Math.round(cy-h-1),w,h);ctx.drawImage(GUN.rev.img,Math.round(cx-w/2),Math.round(cy+1),w,h);}
  else if(img){const s=Math.min(2.2,maxW/img.width),w=Math.round(img.width*s),h=Math.round(img.height*s);ctx.drawImage(img,Math.round(cx-w/2),Math.round(cy-h/2),w,h);}
  ctx.restore();
}
function updateQ(){
  if(G.state!=='play'||!P||P.dead)return;
  if(keys.KeyQ){G.qHold=(G.qHold||0)+1;if(G.qHold===14&&!G.cine)openWheel();}
  else{if(G.qHold>0&&G.qHold<14)switchWp(1);G.qHold=0;}
}
function openWheel(){G.state='wheel';G.wheel={sel:-1,t:0};G.qHold=0;sfx('ui');}
function wheelPos(i,n){const a=-Math.PI/2+i*Math.PI*2/n;return [W/2+Math.cos(a)*74,H/2+Math.sin(a)*74];}
function updateWheel(){
  const g=G.wheel;g.t++;const n=WHEEL_W.length;
  const dx=mouse.x-W/2,dy=mouse.y-H/2;
  if(Math.hypot(dx,dy)>14){
    let a=Math.atan2(dy,dx)+Math.PI/2;if(a<0)a+=Math.PI*2;g.sel=Math.round(a/(Math.PI*2/n))%n;
  }
  const choose=()=>{const k=WHEEL_W[g.sel];if(g.sel>=0&&avail().indexOf(k)>=0)setWp(k);G.state='play';G.wheel=null;G.qHold=0;};
  if(mouse.click&&g.sel>=0&&g.t>2){
    let hit=-1;WHEEL_W.forEach((k,i)=>{const p=wheelPos(i,n);if(Math.hypot(mouse.x-p[0],mouse.y-p[1])<28)hit=i;});
    if(hit>=0){g.sel=hit;choose();return;}
  }
  if(pressed.Escape){G.state='play';G.wheel=null;return;}
  if(!keys.KeyQ&&g.t>3)choose();
}
function drawWheel(){
  const g=G.wheel,n=WHEEL_W.length,av=avail();
  ctx.fillStyle='rgba(8,4,4,0.62)';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.strokeStyle='rgba(150,22,22,0.75)';ctx.lineWidth=9;ctx.beginPath();ctx.arc(W/2,H/2,74,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(90,10,10,0.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(W/2,H/2,80,0,Math.PI*2);ctx.stroke();ctx.restore();
  WHEEL_W.forEach((k,i)=>{
    const p=wheelPos(i,n),own=av.indexOf(k)>=0,sel=g.sel===i,cur=P.wp===k,r=sel?26:22;
    ctx.fillStyle=own?(cur?'#8a4a24':'#4a2a20'):'#16120e';
    ctx.beginPath();ctx.arc(p[0],p[1],r,0,Math.PI*2);ctx.fill();
    if(own){
      const mag=magOf(k),am=P.ammo[k]!==undefined?P.ammo[k]:mag,f=clamp(am/mag,0,1);
      ctx.strokeStyle=sel?'#ffffff':'rgba(235,225,205,0.85)';ctx.lineWidth=sel?3:2.5;
      ctx.beginPath();ctx.arc(p[0],p[1],r+2,-Math.PI/2,-Math.PI/2+Math.PI*2*f);ctx.stroke();
      wheelIcon(k,p[0],p[1],sel?36:30,1);
      txt(am+'/'+mag,p[0],p[1]+r+5,'#f3e3b8',8,'center');
    }else{ctx.strokeStyle='rgba(80,70,60,0.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p[0],p[1],r+2,0,Math.PI*2);ctx.stroke();}
  });
  const sk=g.sel>=0?WHEEL_W[g.sel]:P.wp,own=av.indexOf(sk)>=0;
  txt(own?WP[sk].name:'BLOQUEADA',W/2,H/2-4,own?'#f3e3b8':'#8a7458',8,'center');
  const lockTip={tommy:'compre no ferreiro',gold:'derrote o Barão',dbl:'atiradores da tempestade',sniper:'conserte no ferreiro',dual:'derrote o Billy'};
  txt(own?(P.wp===sk?'equipada':'solte Q para equipar'):(lockTip[sk]||''),W/2,H/2+8,'#9a8a6a',8,'center');
}

function escTarget(e){
  if(ESC&&!ESC.done&&ESC.hp>0&&R.id==='escolta'&&Math.abs(P.x-e.x)>115)return {x:ESC.x,y:ESC.y-24,wag:true};
  return {x:P.x,y:P.y-10,wag:false};
}
AI.raider=function(e){
  e.vy=Math.min(e.vy+0.32,7);e.tm++;
  const t=escTarget(e),dx=t.x-e.x,ad=Math.abs(dx);e.face=dx>=0?1:-1;
  if(e.st!=='aim'&&e.st!=='cool')e.st='move';
  if(e.st==='move'){
    e.vx=ad>150?e.face*1.0:(ad<96?-e.face*0.6:0);
    if(e.onGround&&e.vx&&!groundAt(e.x+Math.sign(e.vx)*10,e.y))e.vx=0;
    if(ad<=168&&!P.dead){e.st='aim';e.tm=0;e.vx=0;}
  }else if(e.st==='aim'){
    e.vx=0;e.aimA=Math.atan2(t.y-(e.y-10),dx);
    if(e.tm===26){bulletE(e.x+Math.cos(e.aimA)*11,e.y-10+Math.sin(e.aimA)*11,e.aimA,2.3,{r:2});sfx('efire');}
    if(e.tm>=44){e.st='cool';e.tm=0;}
  }else{e.vx=0;if(e.tm>46)e.st='move';}
  bodyMove(e,false);
};
AI.rdynw=function(e){
  e.vy=Math.min(e.vy+0.32,7);e.tm++;if(e.cd>0)e.cd--;
  const t=escTarget(e),dx=t.x-e.x,dy=t.y-e.y,ad=Math.abs(dx);e.face=dx>=0?1:-1;
  if(e.st==='throw'){
    e.vx=0;
    if(e.tm===20){const fl=40+Math.min(22,ad/10);EN.push(mkEn({t:'tnt',x:e.x+e.face*8,y:e.y-14,vx:clamp(dx/fl,-3.4,3.4),vy:-0.1*fl-0.4+clamp(dy/fl,-2,1)}));sfx('dash');}
    if(e.tm>34){e.st='move';e.cd=rint(80,110);}
  }else{
    e.st='move';e.vx=ad>185?e.face*1.0:(ad<110?-e.face*0.6:0);
    if(e.onGround&&e.vx&&!groundAt(e.x+Math.sign(e.vx)*10,e.y))e.vx=0;
    if(ad<215&&!(e.cd>0)&&!P.dead){e.st='throw';e.tm=0;}
  }
  bodyMove(e,false);
};
function drawRaider(e){
  drawSpr(e.flash>0?S.banditW:S.bandit,e.x,e.y,e.face,1,1,0);
  const a=e.aimA===undefined?(e.face>0?0:Math.PI):e.aimA;drawGun('rev',e.x+Math.cos(a)*7,e.y-7+Math.sin(a)*7,a,0);
  if(e.st==='aim'&&e.tm>16&&e.tm<26&&Math.floor(e.tm/3)%2===0)txt('!',e.x-3,e.y-34,'#ff3a2a',8);
}

function startEscort(){
  ESC={x:8*T,y:FL(R)*T,hp:120,max:120,speed:0.62,amb:0,grp:null,t:0,fail:0,done:false,flash:0};
  G.cp={room:'escolta',x:4*T,y:FL(R)*T};
  banner('ESCOLTE A CARROÇA','Não deixe ela ser destruída! O forte do Barão fica no fim da estrada.',230,'#ffe27a');
}
function spawnEscGroup(i){
  const g=ESC_GROUPS[i];ESC.grp='g'+i;ESC.gt=0;
  for(const [t,side,n] of g)for(let k=0;k<n;k++){
    const x=clamp(t==='vult'?ESC.x+rnd(180,280):(side>0?ESC.x+rnd(280,430):ESC.x-rnd(230,330)),30,R.w*T-30);
    const y=t==='vult'?FL(R)*T-rnd(60,110):FL(R)*T;
    const e=mkEn({t,x,y,wave:ESC.grp});e.st='move';if(t==='armored'){e.rng=700;e.dir=side>0?-1:1;}EN.push(e);
  }
  banner('EMBOSCADA '+(i+1)+' DE 6','Proteja a carroça!',100,'#ff8a5a');sfx('ready');
}
function escortBlast(x,y,r){
  if(!ESC||R.id!=='escolta'||ESC.done||ESC.fail)return;
  if(Math.hypot(x-ESC.x,(y)-(ESC.y-20))<r+42){ESC.hp-=14;ESC.flash=10;G.shake=Math.max(G.shake,6);}
}
function updateEscort(){
  if(!ESC||!R||R.id!=='escolta')return;
  ESC.t++;if(ESC.flash>0)ESC.flash--;
  if(ESC.fail){ESC.fail++;if(ESC.fail===100&&!G.fade)fadeTo(()=>enterRoom('escolta',4*T,FL(R)*T,1));return;}
  if(ESC.done)return;
  const bx0=ESC.x-38,bx1=ESC.x+38,by0=ESC.y-52,by1=ESC.y;
  for(const b of BUL){
    if(b.dead||b.own!=='e')continue;
    if(b.x>bx0&&b.x<bx1&&b.y>by0&&b.y<by1){b.dead=true;ESC.hp-=1.6;ESC.flash=6;spark(b.x,b.y,'#ffb347');sfx('hit');}
  }
  if(ESC.hp<=0){
    ESC.fail=1;ESC.hp=0;G.shake=18;sfx('boom');sfx('boom');
    burst(ESC.x,ESC.y-26,50,['#f2dca4','#8a5a30','#5b3a1a','#ff8a2a','#ffd24a'],4,0.1,60,3);
    banner('A CARROÇA FOI DESTRUÍDA!','Tentando de novo...',140,'#ff5a3c');return;
  }
  if(ESC.grp){
    ESC.gt=(ESC.gt||0)+1;
    if(ESC.gt%480===0)for(const e of EN)if(e.wave===ESC.grp&&!e.dead&&(Math.abs(e.x-ESC.x)>420||Math.abs(e.x-P.x)>520)){e.x=clamp(ESC.x+rnd(300,360),30,R.w*T-30);if(e.t==='armored'){e.dir=-1;}}   /* ninguém fica longe demais: evita travar a escolta */
    const alive=EN.filter(e=>e.wave===ESC.grp&&!e.dead&&e.t!=='tnt').length;
    if(!alive){banner('EMBOSCADA REPELIDA','A carroça foi consertada um pouco.',100,'#9fe8a0');sfx('save');ESC.hp=Math.min(ESC.max,ESC.hp+18);spawnPK(P.x,P.y-40,'tape',1);ESC.grp=null;}
  }
  if(!ESC.grp){
    ESC.x+=ESC.speed;
    const nx=ESC_PTS[ESC.amb];
    if(nx!==undefined&&ESC.x>=nx*T){spawnEscGroup(ESC.amb);ESC.amb++;}
    else if(nx===undefined&&ESC.x>=(R.w-10)*T){ESC.done=true;startGate();}
  }
  if(G.t%4===0&&!ESC.grp)PART.push({x:ESC.x-34,y:ESC.y-2,vx:rnd(-1.2,-0.4),vy:rnd(-0.6,-0.1),life:22,max:22,col:'#e8b070',sz:2,grav:0});
}
function drawEscortWagon(){
  const E=ESC;if(!E)return;
  const moving=!E.grp&&!E.done&&!E.fail;
  if(!E.fail){
    drawHorse(S.horse,E.x+74,E.y+1,1,moving?Math.floor(G.t/5)%4:4,1);
    drawWagon(E.x,E.y,E.x*0.06,moving?Math.sin(G.t*0.3)*0.012:0);
    drawSpr(S.brandon,E.x+34,E.y-27,1,1,1,0);
    if(E.flash>0&&Math.floor(E.flash/2)%2===0){ctx.save();ctx.globalAlpha=0.35;ctx.fillStyle='#ff3a2a';ctx.fillRect(Math.round(E.x-40),Math.round(E.y-52),80,52);ctx.restore();}
  }
}

}

/* ---------- neve que vai branqueando o corpo (aos poucos; pular na neve deixa tudo branco) ---------- */
let SNOWLVL=0;
const SNOWC=new WeakMap();
function snowTint(img,lv){
  if(!lv||!img||!img.getContext||!img.width)return img;
  const q=Math.min(6,Math.round(lv*6));if(!q)return img;
  let m=SNOWC.get(img);if(!m){m={};SNOWC.set(img,m);}
  if(m[q])return m[q];
  const w=img.width,h=img.height,[c,x]=mk(w,h);x.drawImage(img,0,0);
  let d;try{d=x.getImageData(0,0,w,h);}catch(e){d=null;}
  if(!d||!d.data){m[q]=img;return img;}
  const a=d.data,list=[];
  for(let i=0;i<w*h;i++){
    const r=a[i*4],g=a[i*4+1],b=a[i*4+2],al=a[i*4+3];if(al<200)continue;
    if(r>140&&g>100&&b>50&&b<175&&r-b>40&&g>r*0.62){const px=i%w,py=(i/w)|0;list.push([i,hash(px*3.1,py*1.7)*0.55+(1-px/w)*0.25+(py/h)*0.2]);}
  }
  list.sort((u,v)=>u[1]-v[1]);
  const n=Math.floor(list.length*q/6);
  for(let k=0;k<n;k++){const i=list[k][0],sh=(a[i*4]+a[i*4+1])<330?0.93:1;a[i*4]=(244*sh)|0;a[i*4+1]=(247*sh)|0;a[i*4+2]=(252*sh)|0;}
  x.putImageData(d,0,0);m[q]=c;return c;
}
const TRACKS=[];
function jumpIntoSnow(){

  ftext(P.x,P.y-30,'AFUNDOU NA NEVE!','#dfe9f4');

/* ---------- temperatura: -20 congela e mata; fogueiras e munição de fogo esquentam ---------- */
const TEMP_MIN=-20,TEMP_MAX=5;
function warmthNear(){
  let w=0;
  for(const s of ST){
    if(s.t==='fire'){const d=Math.hypot(P.x-s.x,P.y-s.y);if(d<82)w=Math.max(w,0.05*(1-d/110));}
    else if(s.t==='lamp'){if(Math.abs(P.x-s.x)<36)w=Math.max(w,0.012);}
  }
  if(R.warm)w=Math.max(w,0.08);
  return w;
}
function iceHit(){
  if(P.dead||P.dashT>0||P.hidden)return;
  P.iceT=120;G.flags.temp=Math.max(TEMP_MIN,(G.flags.temp||0)-3);P.snow=Math.min(1,(P.snow||0)+0.2);
  sfx('ice');burst(P.x,P.y-10,12,['#bfefff','#ffffff','#6ad0ff'],2.2,0.02,26,2);G.iceFlash=10;
}
function updateWinter(){
  const f=G.flags;if(f.temp===undefined)f.temp=0;
  if(P.iceT>0)P.iceT--;if(G.iceFlash>0)G.iceFlash--;
  if(R&&R.snowy){
    if(!P.onGround)P.air=(P.air||0)+1;else{if(P.air>9&&!P.dead)jumpIntoSnow();P.air=0;}
  }else P.air=0;
  P.slowMul=1;
  if(!R||P.dead||G.cine){return;}
  /* neve no corpo e nos inimigos */
  if(R.snowy&&R.cold){
    P.snow=Math.min(1,(P.snow||0)+0.00026+(Math.abs(P.vx)>0.4?0.0002:0));
    for(const e of EN)if(!e.ally&&!e.dead)e.snow=Math.min(0.85,(e.snow||0)+0.0004);
  }else if(P.snow>0)P.snow=Math.max(0,P.snow-0.0006);
  const w=warmthNear();
  if(w>0.02&&P.snow>0)P.snow=Math.max(0,P.snow-0.006);
  /* rastros e fofura da neve */
  if(R.snowy){
    if(P.onGround&&Math.abs(P.vx)>0.4){
      if(G.t%6===0)PART.push({x:P.x-P.face*4,y:P.y,vx:rnd(-0.4,0.4),vy:rnd(-0.7,-0.2),life:18,max:18,col:'#f4f8fc',sz:2,grav:0.02});
      const lt=TRACKS[TRACKS.length-1];
      if(!lt||Math.abs(lt.x-P.x)>6||lt.room!==R.id){TRACKS.push({x:P.x,y:P.y,age:0,f:P.face,room:R.id});if(TRACKS.length>140)TRACKS.shift();}
    }
    for(const s of ST)if(s.t==='drift'&&Math.abs(P.x-s.x)<26&&P.onGround){P.slowMul*=0.8;if(G.t%3===0)PART.push({x:P.x+rnd(-6,6),y:P.y-rnd(0,8),vx:rnd(-0.6,0.6),vy:rnd(-1,-0.2),life:22,max:22,col:'#ffffff',sz:2,grav:0.03});P.snow=Math.min(1,(P.snow||0)+0.002);}
  }
  for(const t of TRACKS)t.age++;
  while(TRACKS.length&&TRACKS[0].age>520)TRACKS.shift();
  /* frio */
  if(!R.cold){f.temp=Math.min(0,f.temp+0.01);P.slowMul*=P.iceT>0?0.55:1;return;}
  const rate=R.cold===2?0.0105:0.0075;
  f.temp+=(w>0.02?w:(w-rate));
  for(const b of BUL)if(b.own==='p'&&b.kind==='fire'&&!b.warmed){b.warmed=true;f.temp+=5;ftext(P.x,P.y-30,'+5°','#ffb347');}
  f.temp=clamp(f.temp,TEMP_MIN,TEMP_MAX);
  const cold=Math.max(0,-f.temp-8);
  P.slowMul*=(1-Math.min(0.3,cold/40))*(P.iceT>0?0.55:1);
  if(f.temp<=TEMP_MIN&&!P.dead){G.frozenDeath=true;banner('CONGELOU!','O frio foi mais forte que o xerife.',200,'#9fe8ff');die();}
}

    ctx.globalAlpha=a;rc(ctx,'#93a6bf',Math.round(t.x)-2,Math.round(t.y)-1,5,1);rc(ctx,'#c9d8ea',Math.round(t.x)-2,Math.round(t.y),5,1);

AI.frostgun=function(e){
  e.vy=Math.min(e.vy+0.32,7);e.tm++;if(e.cd>0)e.cd--;if(e.dodge>0)e.dodge--;if(e.kick>0)e.kick--;if(e.warn>0)e.warn--;

  const dx=P.x-e.x,ad=Math.abs(dx),dy=P.y-e.y;

  if(!near){walkerMove(e,0.5);e.face=e.dir;bodyMove(e,false);return;}

  if(!(e.dodge>0)&&e.onGround){
    for(const b of BUL){if(b.own!=='p'||b.dead)continue;const rel=e.x-b.x;
      if(Math.abs(b.y-(e.y-10))<18&&Math.abs(rel)<70&&Math.sign(rel)===Math.sign(b.vx)){e.vy=-5.4;e.dodge=55;break;}}
  }
  if(e.side===undefined)e.side=Math.random()<0.5?-1:1;
  if(e.tm%60===0){const fr=EN.find(o=>o!==e&&!o.dead&&(o.t==='frostgun'||o.t==='frostdyn')&&Math.abs(o.x-e.x)<70);if(fr)e.side=-(Math.sign(fr.x-e.x)||1);e.str=rint(-1,1);}
  const low=e.hp<=e.maxhp*0.4;
  let want=0;
  if(low)want=-e.face;else if(ad>170)want=e.face;else if(ad<85)want=-e.face;else want=(e.str||0)*e.side;
  e.vx=want*(low?1.3:0.95);
  if(e.onGround&&e.vx&&!groundAt(e.x+Math.sign(e.vx)*10,e.y))e.vx=0;
  if(!(e.cd>0)&&ad<235&&clearLine(e.x,e.y-10,P.x,P.y-10)&&!(e.burst>0)){e.burst=3;e.bt=0;e.cd=rint(85,120);e.warn=18;}

/* labirinto: cada plataforma de um andar se apoia em outra do andar de baixo (sempre dá para subir),
   mas há becos sem saída, andares que se repetem e poços (portas) que levam a outras galerias */
const MZ_LV=3;
function mazeLayout(w,h,seed){
  const R2=rr(seed),segs=[],floor=h-3;
  let prev=[{x:0,w:w,row:floor}];
  for(let row=floor-MZ_LV;row>=6;row-=MZ_LV){
    const cur=[],n=R2.i(4,6);
    for(let k=0;k<n;k++){
      const low=R2.p(prev),sw=R2.i(4,9);
      let x=low.x+R2.i(-sw+2,low.w-2);x=clamp(x,2,w-sw-2);
      if(cur.some(s=>x<s.x+s.w+2&&x+sw>s.x-2))continue;
      cur.push({x,w:sw,row,low});
    }
    if(!cur.length){const low=prev[0],sw=6,x=clamp(low.x+2,2,w-sw-2);cur.push({x,w:sw,row,low});}
    cur.forEach(s=>segs.push(s));prev=cur;
  }
  return segs;
}
function mazeRoom(id,seed,doors,foes){
  const w=100,h=48,r=room(id,w,h,'mine',null);fl(r,0,w);deep(r);r.cold=0;
  const segs=mazeLayout(w,h,seed);
  segs.forEach(s=>plat(r,s.x,s.row,s.w));
  r.segs=segs;
  /* poços: portas que levam a outras galerias */
  const R2=rr(seed+7);
  doors.forEach((d,i)=>{
    const cand=segs.filter(s=>s.w>=5),s=cand[(R2.i(0,cand.length-1)+i*3)%cand.length]||segs[0];
    st(r,'door',s.x+(s.w>>1),{row:s.row,to:d.to,sx:d.sx,sy:d.sy,label:d.label,mine:true});
  });
  st(r,'fire',3);
  const R3=rr(seed+13);
  segs.forEach((s,i)=>{
    if(i%2===0)en(r,R3.p(foes),s.x+(s.w>>1),s.row,{rng:20});
  });
  r.decor=c=>{
    const g=FL(r)*T,R4=rr(seed+21);
    for(let x=6;x<w;x+=R4.i(8,14)){rc(c,'#3b2514',x*T,0,6,g);rc(c,'#5b3a1a',x*T+1,0,2,g);}
    segs.forEach(s=>{
      for(let x=s.x+1;x<s.x+s.w-1;x+=5){rc(c,'#3b2514',x*T+4,s.row*T-26,4,26);rc(c,'#241509',x*T+3,s.row*T-28,6,3);}
      if(R4.c(0.85))dLamp(c,(s.x+(s.w>>1))*T+8,s.row*T,'#ffb347',54);
    });
  };
  return r;
}

function briggsPick(e){

/* Briggs percorre a arena inteira: anda, recua, desvia de lado enquanto atira e dá saltos longos */
AI.briggs=function(e){
  e.tm++;if(e.kick>0)e.kick--;if(!e.ph)e.ph=1;if(e.warn>0)e.warn--;
  const g0=FL(R)*T,dx=P.x-e.x,p2=e.ph>=2;
  if(e.st!=='dead'&&e.st!=='wait'&&e.st!=='intro'&&e.st!=='rise')e.face=dx>=0?1:-1;
  const xmin=40,xmax=R.w*T-40,spdW=p2?2.2:1.6,gap=p2?36:56;
  const strafe=k=>{if(e.sd===undefined)e.sd=1;e.x=clamp(e.x+e.sd*k,xmin,xmax);if(e.x<=xmin+2||e.x>=xmax-2)e.sd*=-1;};
  const done=t=>{if(e.tm>t){e.st='idle';e.tm=0;}};
  switch(e.st){
    case 'wait':case 'intro':break;
    case 'rise':
      e.jy=Math.max(0,e.jy-0.4);
      if(e.tm===60){e.inv=false;e.st='idle';e.tm=0;e.jy=0;}
      break;
    case 'idle':{
      if(e.tx===undefined||Math.abs(e.x-e.tx)<8||e.tm%150===0){
        let tx=0,tries=0;do{tx=rnd(xmin,xmax);tries++;}while((Math.abs(tx-P.x)<90||Math.abs(tx-P.x)>300)&&tries<14);e.tx=tx;
      }
      e.x=clamp(e.x+Math.sign(e.tx-e.x)*spdW,xmin,xmax);
      if(e.tm>gap)briggsPick(e);
      break;}
    case 'g_toss':
      strafe(1.2);if(e.tm===14||e.tm===32||e.tm===50)briggsToss(e,1,0,0);done(78);break;
    case 'g_fan':
      strafe(0.9);if(e.tm===22||e.tm===52)briggsToss(e,7,0.8,0);done(80);break;
    case 'g_cluster':
      if(e.tm===1)e.warn=24;strafe(0.7);if(e.tm===24||e.tm===58)briggsToss(e,1,0,0,true);done(86);break;
    case 'g_dash':case 'h_dash':{
      const lead=p2?20:28;
      if(e.tm<lead){if(e.tm%5===0)puff(e.x,e.y);if(e.tm===1)e.dd=e.face;}
      else if(e.tm<lead+24){e.x=clamp(e.x+e.dd*(p2?7:5.6),xmin,xmax);if(e.tm%3===0)puff(e.x-e.dd*14,e.y);}
      else if(e.tm===lead+24){briggsToss(e,p2?5:3,0.7,0);}
      done(lead+36);break;}
    case 'g_slam':case 'h_slam':
      if(e.tm<=38){e.jy=Math.sin(e.tm/38*Math.PI)*64;e.x=clamp(e.x+(e.tm<26?Math.sign(dx)*2:0),xmin,xmax);}
      else{
        e.jy=0;
        if(e.tm===39){G.shake=14;sfx('boom');puff(e.x,e.y);for(let i=0;i<(p2?6:4);i++)briggsDrop(e,(i%2?1:-1)*(1.3+i*0.5),-3.4,30);}
        done(72);
      }
      break;
    case 'g_leap':case 'h_leap':
      if(e.tm===1){e.lx0=e.x;const side=P.x<R.w*T/2?1:-1;e.lx1=clamp(P.x+side*rnd(150,280),xmin,xmax);e.warn=14;}
      if(e.tm>14&&e.tm<=64){
        const k=(e.tm-14)/50;e.x=e.lx0+(e.lx1-e.lx0)*k;e.jy=Math.sin(k*Math.PI)*96;
        if(e.tm===30||e.tm===46||(p2&&e.tm===38))briggsDrop(e,e.face*1.2,0.4,32);
      }else if(e.tm>64){
        e.jy=0;if(e.tm===65){G.shake=12;sfx('boom');puff(e.x,e.y);briggsToss(e,p2?3:1,0.9,0);}
      }
      done(88);break;
    case 'h_rain':
      if(e.tm===1)e.warn=26;strafe(0.8);
      if(e.tm>=26&&(e.tm-26)%8===0&&(e.tm-26)/8<10){
        const k=(e.tm-26)/8,tx=clamp(P.x+(k-4.5)*30,30,R.w*T-30);
        const s=mkEn({t:'gren',x:tx,y:g0-170,vx:0,vy:0.6,er:34});s.fuse=70;s.dm=2;EN.push(s);sfx('dash');
      }
      done(130);break;
    case 'h_toss3':
      strafe(1.4);if(e.tm===14||e.tm===28||e.tm===42||e.tm===56)briggsToss(e,2,1.2,0);done(92);break;
    case 'h_cluster':
      if(e.tm===1)e.warn=20;strafe(1);if(e.tm===20||e.tm===46||e.tm===72)briggsToss(e,1,0,0,true);done(100);break;
    case 'dead':case 'fallen':e.vx=0;break;
  }
  e.y=g0-(e.jy||0);
};

const SKC={};
function recolorGun(img,kind){
  const w=img.width,h=img.height,[c,x]=mk(w,h);x.drawImage(img,0,0);
  let d;try{d=x.getImageData(0,0,w,h);}catch(e){return img;}
  if(!d||!d.data)return img;
  const a=d.data;
  for(let i=0;i<w*h;i++){
    const r=a[i*4],g=a[i*4+1],b=a[i*4+2],al=a[i*4+3];if(al<40)continue;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b),L=(r+g+b)/3,sat=mx?(mx-mn)/mx:0;
    if(sat>0.26||L<34)continue;
    let nr,ng,nb;
    if(kind==='gold'){const t=clamp((L-40)/190,0,1);nr=90+t*160;ng=58+t*150;nb=10+t*100;}
    else if(kind==='black'){const t=clamp(L/255,0,1);nr=18+t*70;ng=18+t*72;nb=24+t*84;}
    else{const t=clamp(L/255,0,1);nr=150+t*100;ng=152+t*100;nb=160+t*95;}
    a[i*4]=nr;a[i*4+1]=ng;a[i*4+2]=nb;
  }
  x.putImageData(d,0,0);return c;
}
function gunBase(id){return id==='tommy'?GUN.tommy.img:id==='sniper'?S.sniperSmall:(id==='sg'?GUN.sg.img:(id==='dbl'?GUN.dbl.img:(id==='gold'?GUN.gold.img:GUN.rev.img)));}

  const k=id+'@'+sk;if(!SKC[k])SKC[k]=recolorGun(b,sk);return SKC[k];
}
function playerGun(id){

  const key=base+'@'+sk+'#'+id;if(!GUN[key])GUN[key]=Object.assign({},GUN[base],{img:gunImg(id)});return GUN[key]?key:base;
}

const BK_COST={bandit:1,dyn:2,miner:1,weed:1,vult:2,bat:2,armored:4,rdyn:2,gunman:3,raider:2,frostgun:3,frostdyn:3,icearm:5};
const BK_BOSSES=[['boss','BILLY REEVES'],['gghost','FANTASMA GIGANTE'],['baron','BARÃO DA FARINHA'],['briggs','BARÃO BRIGGS FARINHA']];
function bankPool(n){
  const p=['bandit','dyn','miner'];
  if(n>=2)p.push('weed');if(n>=3)p.push('vult','bat');if(n>=4)p.push('armored','rdyn');
  if(n>=6)p.push('gunman','raider');if(n>=9)p.push('frostgun','frostdyn','icearm');
  return p;
}
function bankWaveList(n){
  const pool=bankPool(n),list=[];let budget=5+Math.floor(n*3.2);
  while(budget>0){const t=pick(pool),c=BK_COST[t]||1;if(c>budget&&list.length)break;budget-=c;list.push(t);}
  const th=Math.min(1+Math.floor((n-1)/2),6);
  for(let i=0;i<th;i++)list.splice(rint(0,list.length),0,'thief');
  return list;
}
function bankSpawn(t,side){
  const x=side<0?20:R.w*T-20,flying=t==='vult'||t==='bat';
  const y=flying?(t==='bat'?3*T:FL(R)*T-120):FL(R)*T;
  const e=mkEn({t,x,y});e.bankE=true;e.face=-side;e.home=x;e.rng=60;
  if(t==='bat'){e.st='fly';}
  EN.push(e);burst(x,y-10,8,['#ffffff','#c8b48a'],1.6,0.02,14,2);return e;
}
function bankSpawnBoss(n){
  const k=Math.floor(n/5)-1,def=BK_BOSSES[k%BK_BOSSES.length],loop=Math.floor(k/BK_BOSSES.length),t=def[0];
  const x=R.w*T-5*T,b=mkEn({t,x,y:FL(R)*T});
  b.bankE=true;b.bankBoss=true;b.bname=def[1];b.st='idle';b.ph=1;b.face=-1;b.tm=0;
  const mul=1+loop*0.6;b.max=Math.round(b.max*mul);b.hp=b.max;
  if(t==='briggs'){b.bars=2;b.risen=false;}
  EN.push(b);G.boss=b;G.bossFight=true;
  banner('CHEFE: '+def[1],'Onda '+n+'!',200,'#ff8a2a');sfx('ready');return b;
}

  B.t++;B.robbing=B.robT>0;if(B.robT>0)B.robT--;

      const maxAlive=8+Math.min(6,Math.floor(B.wave/3));
      if(bankAlive()<maxAlive){const t=B.q.shift();bankSpawn(t,Math.random()<0.5?-1:1);B.spawnT=rint(34,70);}else B.spawnT=20;

/* ---------- cenário: céu laranja, sol contornado, prédios em silhueta, chamas ---------- */
function cDisc(c,cx,cy,r,col){for(let dy=-r;dy<=r;dy++){const h=Math.round(Math.sqrt(r*r-dy*dy));rc(c,col,cx-h,cy+dy,h*2,1);}}
function dCity(c,r,burn){
  const w=r.w*T,g=FL(r)*T,cx=w/2,R2=rr(burn?717:709);
  /* céu em faixas */
  [[0,'#f86a00'],[40,'#ff7a00'],[84,'#ff8c08'],[120,'#ffa000'],[150,'#ffb400']].forEach((b,i,a)=>rc(c,b[1],0,b[0],w,(a[i+1]?a[i+1][0]:g)-b[0]));
  if(burn){for(let i=0;i<26;i++){const x=R2.i(0,w),y=R2.i(0,90);rc(c,'rgba(60,20,8,0.35)',x,y,R2.i(40,120),R2.i(4,10));}}
  /* o sol, com contorno preto grosso */
  cDisc(c,cx,74,52,'#000');cDisc(c,cx,74,47,'#ff9800');
  for(let dy=10;dy<=47;dy++){const h=Math.round(Math.sqrt(47*47-dy*dy));rc(c,'#e88000',cx-h,74+dy,h*2,1);}
  for(let dy=-47;dy<=-20;dy++){const h=Math.round(Math.sqrt(47*47-dy*dy))-10;if(h>0)rc(c,'#ffb020',cx-h,74+dy,h*2,1);}
  /* o caminho de luz que desce do sol */
  for(let y=118;y<g;y++){const k=(y-118)/(g-118),h1=Math.round(190-k*120),h2=Math.round(150-k*110);rc(c,'#ffb000',cx-h1,y,h1*2,1);rc(c,'#ffe000',cx-h2,y,h2*2,1);}
  /* prédios: silhuetas ocre com contorno preto */
  const bld=(x,wd,h)=>{
    const top=g-h;
    rc(c,'#000',x-4,top-4,wd+8,h+4);
    rc(c,burn?'#c08a28':'#e6b040',x,top,wd,h);
    for(let y=top+10;y<g-40;y+=14)rc(c,burn?'#9a6c1c':'#c09030',x,y,wd,5);
    rc(c,burn?'#7a5210':'#a87a20',x,g-Math.round(h*0.42),wd,Math.round(h*0.42));
    rc(c,'#000',x,g-Math.round(h*0.42)-3,wd,3);
    /* janelas */
    for(let wy=top+16;wy<g-30;wy+=26)for(let wx=x+8;wx<x+wd-14;wx+=20){
      rc(c,'#000',wx-1,wy-1,12,14);rc(c,burn?(R2.c(0.55)?'#ff8a00':'#1a0c04'):(R2.c(0.6)?'#ffe9a0':'#5a3a1a'),wx,wy,10,12);
      if(burn&&R2.c(0.4)){rc(c,'#ffe000',wx+2,wy+4,6,8);}
    }
    if(burn){
      /* topo quebrado e vigas caídas */
      for(let k=0;k<4;k++){const nx=x+R2.i(0,wd-14),nw=R2.i(8,18),nh=R2.i(8,26);rc(c,'#000',nx-3,top-4,nw+6,nh+3);rc(c,'#ff8c08',nx,top-4,nw,nh);}
      for(let k=0;k<2;k++){const bx=x+R2.i(0,wd-30),by=g-R2.i(20,70);for(let i=0;i<24;i++)rc(c,'#000',bx+i,by+Math.round(i*0.6),4,4);}
    }else{
      rc(c,'#000',x-6,top-10,wd+12,8);rc(c,'#a87a20',x-4,top-8,wd+8,4);
      if(R2.c(0.5)){rc(c,'#000',x+6,g-52,wd-12,12);rc(c,'#f0dca0',x+8,g-50,wd-16,8);}
      rc(c,'#000',x+wd/2-9,g-30,18,30);rc(c,'#5a3a1a',x+wd/2-7,g-28,14,28);
    }
  };
  let x=-6;while(x<cx-150){const wd=R2.i(50,84),h=R2.i(90,178);bld(x,wd,h);x+=wd+2;}
  x=cx+150;while(x<w+10){const wd=R2.i(50,84),h=R2.i(90,178);bld(x,wd,h);x+=wd+2;}
  /* encostas ocre com contorno preto fechando o caminho de luz, como na referência */
  [[cx-150,1],[cx+150,-1]].forEach(a=>{
    for(let i=0;i<46;i++){const hh=Math.round(24+i*1.2);rc(c,'#000',a[0]+a[1]*i*2.2-3,g-hh-4,6,6);}
    for(let i=0;i<46;i++){const hh=Math.round(24+i*1.2);rc(c,burn?'#c08a28':'#e6b040',a[0]+a[1]*i*2.2-1,g-hh,3,hh);}
  });
  if(burn){
    /* base das chamas pintada no fundo (as vivas ficam por cima) */
    for(let fx=0;fx<w;fx+=14){const h=R2.i(18,54);for(let ry=0;ry<h;ry+=2){const k=1-ry/h;rc(c,'#f00000',fx-9*k+7,g-ry-2,18*k,2);}
      const h2=Math.round(h*0.62);for(let ry=0;ry<h2;ry+=2){const k=1-ry/h2;rc(c,'#ff8a00',fx-6*k+7,g-ry-2,12*k,2);}}
    for(let i=0;i<40;i++){const dx=R2.i(0,w),dw=R2.i(8,22);rc(c,'#000',dx-1,g-R2.i(4,10),dw+2,10);}
  }
}

const UNK_COL=[0,'#00e8b0','#ff8a2a','#bffff0'];
function unkRing(e,n,spd,off){for(let i=0;i<n;i++)bulletE(e.x,e.y-24,(off||0)+i/n*Math.PI*2,spd||2.2,{r:3,col:UNK_COL[e.ph]||'#00e8b0',life:200});sfx('efire');}
function unkPick(e){
  const L=e.ph===1?['u_shots','u_dash','u_orbs','u_blink','u_shots']:(e.ph===2?['f_pillars','f_wave','f_rain','u_dash','u_shots','f_wave']:['f_pillars','f_wave','f_rain','u_dash','u_blink','u_shots','p_nova']);
  if(!e.bag||!e.bag.length||e.bagPh!==e.ph){e.bag=L.slice().sort(()=>Math.random()-0.5);e.bagPh=e.ph;if(e.bag[e.bag.length-1]===e.last)e.bag.reverse();}
  const a=e.bag.pop();e.last=a;e.st=a;e.tm=0;e.sd=Math.random()<0.5?-1:1;
}
AI.unknown=function(e){
  e.tm++;if(!e.ph)e.ph=1;if(e.warn>0)e.warn--;
  const g0=FL(R)*T,dx=P.x-e.x,ph=e.ph,xmin=40,xmax=R.w*T-40,spd=[0,1.5,2.0,2.5][ph],gap=[0,58,44,30][ph];
  const busy=e.st==='dead'||e.st==='wait'||e.st==='intro'||e.st==='rage';
  if(!busy)e.face=dx>=0?1:-1;
  const strafe=k=>{e.x=clamp(e.x+(e.sd||1)*k,xmin,xmax);if(e.x<=xmin+2||e.x>=xmax-2)e.sd=-(e.sd||1);};
  const done=t=>{if(e.tm>t){e.st='idle';e.tm=0;e.alpha=1;}};
  if(ph===3&&!busy){e.pul=(e.pul||0)+1;if(e.pul%140===0){unkRing(e,12,2.3,e.pul*0.01);G.shake=Math.max(G.shake,5);}}
  switch(e.st){
    case 'wait':case 'intro':case 'rage':case 'dead':break;
    case 'idle':
      if(e.tx===undefined||Math.abs(e.x-e.tx)<8||e.tm%150===0){let tx=0,n=0;do{tx=rnd(xmin,xmax);n++;}while((Math.abs(tx-P.x)<90||Math.abs(tx-P.x)>300)&&n<14);e.tx=tx;}
      e.x=clamp(e.x+Math.sign(e.tx-e.x)*spd,xmin,xmax);
      if(e.tm>gap)unkPick(e);
      break;
    case 'u_shots':
      strafe(1.1);
      if(e.tm===16||e.tm===34||e.tm===52){const a=Math.atan2((P.y-10)-(e.y-24),dx),n=ph>=2?5:3;for(let i=0;i<n;i++)bulletE(e.x+e.face*14,e.y-24,a+(i-(n-1)/2)*0.2,3.1,{r:3,col:UNK_COL[ph],life:160});sfx('efire');}
      done(76);break;
    case 'u_dash':{
      const lead=ph===1?28:20;
      if(e.tm<lead){if(e.tm%5===0)puff(e.x,e.y);if(e.tm===1)e.dd=e.face;}
      else if(e.tm<lead+24){e.x=clamp(e.x+e.dd*(4.8+ph*0.9),xmin,xmax);if(e.tm%3===0)puff(e.x-e.dd*14,e.y);}
      else if(e.tm===lead+24&&ph>=2)unkRing(e,8,2.4,0.3);
      done(lead+36);break;}
    case 'u_orbs':
      if(e.tm===20){const n=ph>=2?3:2;for(let i=0;i<n;i++)bulletE(e.x,e.y-34,Math.atan2((P.y-10)-(e.y-34),dx)+(i-(n-1)/2)*0.5,1.5,{r:5,col:UNK_COL[ph],life:280});sfx('efire');}
      strafe(0.8);done(64);break;
    case 'u_blink':
      if(e.tm<20)e.alpha=1-e.tm/20;
      else if(e.tm===20){e.x=clamp(P.x-(P.face||1)*120,xmin,xmax);burst(e.x,e.y-24,16,[UNK_COL[ph],'#ffffff'],2.6,0.02,22,2);sfx('dash');}
      else if(e.tm<32)e.alpha=(e.tm-20)/12;
      else if(e.tm===36){e.alpha=1;unkRing(e,ph>=3?12:8,2.5,0);}
      done(62);break;
    case 'f_pillars':
      if(e.tm===1){const n=ph>=3?6:4;for(let i=0;i<n;i++){const px=clamp(P.x+(i-(n-1)/2)*46+rnd(-8,8),20,R.w*T-20);EN.push(mkEn({t:'fpillar',x:px,y:g0}));}sfx('alert');}
      strafe(0.7);done(92);break;
    case 'f_wave':
      if(e.tm===20||(ph>=3&&e.tm===48)){[-1,1].forEach(d=>{const w=mkEn({t:'fwave',x:e.x+d*16,y:g0});w.vx=d*(2.6+ph*0.3);EN.push(w);});sfx('boom');G.shake=Math.max(G.shake,5);}
      done(72);break;
    case 'f_rain':
      if(e.tm>=20&&(e.tm-20)%9===0&&(e.tm-20)/9<(ph>=3?10:8)){const tx=clamp(P.x+rnd(-120,120),20,R.w*T-20);bulletE(tx,g0-200,Math.PI/2+rnd(-0.12,0.12),2.6,{r:3.5,col:'#ff8a2a',life:140});}
      strafe(1);done(112);break;
    case 'p_nova':
      if(e.tm===1)e.warn=30;
      if(e.tm===30||e.tm===52){unkRing(e,16,2.6,e.tm*0.05);G.shake=Math.max(G.shake,8);sfx('boom');}
      done(84);break;
  }
  e.y=g0-(e.jy||0);
};

let TBG=null;
function titleBG(){
  if(TBG)return TBG;
  const [c,x]=mk(W,H),hz=178;
  const sky=['#241040','#2e1450','#3c1a5a','#4e2266','#642a6e','#7e3472','#9a3e74','#b64c72','#ce5e6c','#e2765e','#f08f58','#f6a85a'];
  const bh=hz/sky.length;
  sky.forEach((col,i)=>rc(x,col,0,Math.floor(i*bh),W,Math.ceil(bh)+1));
  for(let i=0;i<sky.length-1;i++){const y=Math.floor((i+1)*bh);for(let px=0;px<W;px+=2)rc(x,sky[i+1],px+(i%2),y-1,1,1);}
  const R=rr(77);
  for(let k=0;k<30;k++){
    const y=R.i(12,150),len=R.i(24,110),x0=R.i(-30,W);
    const col=y<60?'#5a2c7e':(y<110?'#c0608a':'#f6a07a'),hi=y<60?'#7a44a0':(y<110?'#e48aa0':'#ffc49a');
    rc(x,col,x0,y,len,2);rc(x,hi,x0+5,y-1,Math.max(4,len-12),1);
  }
  /* sol com listras */
  const sx=300,sy=hz-4,sr=40;
  for(let dy=-sr;dy<=0;dy++){
    if(dy>-18&&((dy+40)%5<2))continue;
    const w=Math.floor(Math.sqrt(sr*sr-dy*dy));
    rc(x,dy<-26?'#ffeaa8':(dy<-12?'#fbd878':'#f6be5a'),sx-w,sy+dy,w*2,1);
  }
  rc(x,'#c4687a',0,hz-3,W,3);
  for(let px=0;px<W;px+=2){const h=3+Math.floor(hash(px>>3,9)*6);rc(x,'#7a3e7a',px,hz-h+3,2,h);}
  /* morros (buttes) */
  function butte(cols,base,body,lit,dark,strata){
    cols.forEach(cl=>{
      const [x0,x1,top]=cl;
      for(let px=x0;px<x1;px++){
        const t=(px-x0)/(x1-x0),wob=Math.floor(hash(px,top)*3);
        const yTop=top+wob+(t<0.08||t>0.92?6:0);
        const col=t>0.62?lit:(t<0.22?dark:body);
        rc(x,col,px,yTop,1,base-yTop);
      }
      for(let y=top+10;y<base;y+=9)for(let px=x0;px<x1;px++)if(hash(px,y)>0.35)rc(x,strata,px,y,1,1);
    });
  }
  /* talude */
  for(let px=0;px<220;px++){const yy=hz-30+Math.round(Math.abs(px-105)*0.32)+Math.floor(hash(px,3)*3);rc(x,px>130?'#c86a34':'#9a4a2c',px,yy,1,hz+30-yy);}
  butte([[18,72,46],[76,128,30],[132,146,22],[150,160,58]],hz-8,'#a8482c','#e88040','#6a2a2c','#7e3628');
  for(let px=360;px<480;px++){const yy=hz-14+Math.round(Math.abs(px-430)*0.25);rc(x,'#7e3a52',px,yy,1,hz+20-yy);}
  butte([[392,430,96],[432,458,112]],hz-6,'#8a3e56','#b05a62','#5a2a44','#6a3048');
  /* chão do deserto */
  const gnd=['#f0943c','#e4863a','#d67834','#c86a30','#b65c2c'];
  for(let y=hz;y<H;y++){const k=Math.min(gnd.length-1,Math.floor((y-hz)/((H-hz)/gnd.length)));rc(x,gnd[k],0,y,W,1);}
  for(let i=0;i<220;i++){const px=Math.floor(hash(i,41)*W),py=hz+4+Math.floor(hash(i,42)*(H-hz-4));rc(x,hash(i,43)>0.5?'#f8b060':'#b85a2a',px,py,2,1);}
  for(let i=0;i<26;i++){
    const px=Math.floor(hash(i,51)*W),py=hz+10+Math.floor(hash(i,52)*(H-hz-20)),s2=2+Math.floor(hash(i,53)*4);
    rc(x,'#1e4a40',px-s2,py-s2+1,s2*2,s2);rc(x,'#2e6a52',px-s2+1,py-s2,s2*2-2,s2-1);rc(x,'#4a8a64',px-1,py-s2,2,1);
  }
  /* rochas e cactos no primeiro plano */
  for(let px=0;px<110;px++){const yy=H-18+Math.round(Math.abs(px-30)*0.22);rc(x,'#5a1e30',px,yy,1,H-yy);rc(x,'#7a2e3e',px,yy,1,2);}
  for(let px=380;px<W;px++){const yy=H-22+Math.round(Math.abs(px-450)*0.2);rc(x,'#5a1e30',px,yy,1,H-yy);rc(x,'#7a2e3e',px,yy,1,2);}
  function saguaro(cx,base,h){
    rc(x,'#163a26',cx-4,base-h,8,h);rc(x,'#2a7a4a',cx-3,base-h,5,h);rc(x,'#4aa064',cx-2,base-h+2,1,h-4);
    rc(x,'#163a26',cx-14,base-h*0.55,10,4);rc(x,'#163a26',cx-14,base-h*0.55-14,4,14);rc(x,'#2a7a4a',cx-13,base-h*0.55-13,2,13);
    rc(x,'#163a26',cx+4,base-h*0.7,10,4);rc(x,'#163a26',cx+10,base-h*0.7-12,4,12);rc(x,'#2a7a4a',cx+11,base-h*0.7-11,2,11);
  }
  saguaro(24,H-10,70);saguaro(458,H-12,62);
  TBG=c;return c;
}

function wrap(s,n){
  const out=[];let line='';
  for(const w of s.split(' ')){if((line+' '+w).trim().length>n){out.push(line);line=w;}else line=(line+' '+w).trim();}
  if(line)out.push(line);return out;
}

function updatePlay(){
  if(pressed.Escape||pressed.KeyP){G.state='pause';return;}
  if(pressed.KeyM||pressed.Tab){openMap();return;}
  if(pressed.KeyI){G.state='inv';sfx('ui');return;}
  if(G.pendingStage&&!G.fade){const sid=G.pendingStage;G.pendingStage=null;offerCards(sid);return;}
  G.flags.clock=(G.flags.clock||0)+1;
  if(P.dead){
    G.hint=null;G.deadT++;if(G.ghost){G.ghost.t++;G.ghost.y-=0.55;G.ghost.x=G.ghost.bx+Math.sin(G.ghost.t*0.08)*6;}
    if(G.hitstop>0)G.hitstop--;
    updatePlayer();updateParticles();updateHudFx();
    if(G.shake>0)G.shake=Math.max(0,G.shake-0.45);
    if(G.bank&&G.deadT>90){bankGameOver();return;}
    if(G.deadT>110&&(pressed.Enter||pressed.Space||mouse.click))respawn();
    return;
  }
  if(G.hitstop>0){G.hitstop--;return;}
  if(G.shake>0)G.shake=Math.max(0,G.shake-0.45);
  if(G.banner){G.banner.t++;if(G.banner.t>G.banner.dur)G.banner=null;}

}

  G.t++;

  applyTouch();
  const frozen=G.state==='play'&&G.hitstop>0&&P&&!P.dead;
  if(G.fade)updateFade();
  switch(G.state){
    case 'splash':if(Object.keys(pressed).length>0||mouse.click){initAudio();G.state='title';sfx('ui');}break;
    case 'title':updateTitle();break;
    case 'mp':updateMp();break;
    case 'story':updateStory();break;

    case 'dialog':updateDialog();break;
    case 'cards':updateCards();break;
    case 'cine':updateCine();break;
    case 'wheel':updateWheel();break;
    case 'getparry':updateGetParry();break;
    case 'inv':updateInv();break;
    case 'cartas':updateCartas();break;
    case 'pause':updatePauseMenu();break;
    case 'slots':updateSlots();break;
    case 'ach':updateAch();break;
    case 'opt':updateOpt();break;
    case 'loading':updateLoading();break;
    case 'opening':updateOpening();break;
    case 'race':if(typeof updateRace==='function')updateRace();break;
    case 'map':updateMap();break;
    case 'shop':updateShop();break;

    case 'wardrobe':updateWardrobe();break;

let last=0,acc=0,errShown=false;
function frame(now){
  requestAnimationFrame(frame);
  if(!last)last=now;
  acc+=Math.min(100,now-last);last=now;
  let n=0;
  try{
    while(acc>=1000/60&&n<5){update();acc-=1000/60;n++;}
    if(n===5)acc=0;
    render();
  }catch(e){if(!errShown){errShown=true;console.error(e);}}
}

function hardenBullet(b){
  if(b.wave)return;
  const sp=Math.hypot(b.vx,b.vy);if(sp<0.1)return;
  if(!b.grav&&!b.pick&&!b.homing){
    const ang=Math.atan2(b.vy,b.vx),dist=Math.hypot(P.x-b.x,(P.y-10)-b.y);
    const direct=Math.atan2((P.y-10)-b.y,P.x-b.x);
    let dd=ang-direct;while(dd>Math.PI)dd-=2*Math.PI;while(dd<-Math.PI)dd+=2*Math.PI;
    const sp2=sp*HARD.bulletSpd;
    if(Math.abs(dd)<1.2&&dist>24){
      const t=dist/sp2;
      const tx=P.x+clamp(P.vx||0,-3,3)*t*HARD.lead,ty=(P.y-10)+(P.onGround?0:clamp(P.vy||0,-4,4)*t*0.35);
      let da=Math.atan2(ty-b.y,tx-b.x)-direct;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
      const na=ang+clamp(da,-0.7,0.7);
      b.vx=Math.cos(na)*sp2;b.vy=Math.sin(na)*sp2;
    }else{b.vx*=HARD.bulletSpd;b.vy*=HARD.bulletSpd;}
  }
  if(!b.snipe&&!b.pick&&(b.life||0)>=40&&Math.random()<HARD.pink){b.pink=true;b.col='#ff6fd8';b.r=Math.max(b.r||2,2.6);}
}

const CLOUDSPR={};
function mkCloud(seed,tintK,w,h){
  const key=seed+tintK+w,T3=CLOUDT[tintK];

  const n=Math.max(4,Math.round(w/16)),blobs=[];
  for(let i=0;i<n;i++){

    blobs.push({x:Math.round(6+t*(w-12)),y:base-Math.round(r*0.55)-Math.round(R3.f()*3),r});
  }
  const disc2=(cx,cy,r,col)=>{x.fillStyle=col;for(let dy=-r;dy<=r;dy++){const hw=Math.floor(Math.sqrt(r*r-dy*dy));x.fillRect(cx-hw,cy+dy,hw*2+1,1);}};
  blobs.forEach(b=>disc2(b.x,b.y+1,b.r,T3[2]));
  blobs.forEach(b=>disc2(b.x,b.y-1,Math.max(2,b.r-2),T3[1]));
  blobs.forEach(b=>{if(b.r>6)disc2(b.x-1,b.y-3,Math.max(2,b.r-5),T3[0]);});

}

function polyFill(x,pts,col){

    const yy=y+0.5,xs=[];

/* ---------- 1) trilha mais emocionante: andamentos maiores, metais e bateria ---------- */
Object.assign(TDEF.title,{bpm:128,drums:'driving',hits:[3,7],hitsAlways:true,dens:'busy',leadVol:0.082});
Object.assign(TDEF.estrada,{bpm:150,drums:'driving',hits:[3,7],hitsAlways:true,dens:'busy',leadVol:0.08});

Object.assign(TDEF.saloon,{bpm:132,drums:'driving',hits:[3,7],hitsAlways:true,dens:'normal'});
Object.assign(TDEF.deserto,{bpm:134,drums:'driving',hits:[3,7],hitsAlways:true,dens:'busy'});
Object.assign(TDEF.trem,{bpm:172});
Object.assign(TDEF.rancho,{bpm:154,drums:'driving',hits:[3,7],hitsAlways:true,dens:'busy'});
Object.assign(TDEF.vale,{bpm:140,drums:'driving',hits:[3,7],hitsAlways:true,dens:'busy'});
Object.assign(TDEF.trilha,{bpm:140,drums:'driving',hits:[3,7],hitsAlways:true,dens:'busy'});
Object.assign(TDEF.planalto,{bpm:120,drums:'driving',hits:[3],hitsAlways:true,dens:'normal'});
Object.assign(TDEF.escolta,{bpm:154});
['fuga','ponte'].forEach(k=>{TDEF[k].bpm=Math.round(TDEF[k].bpm*1.06);});
['boss','carrasco','fboss','baron','baron3','briggs','briggs2','unk1','unk2','unk3'].forEach(k=>{TDEF[k].bpm=Math.round(TDEF[k].bpm*1.07);});

/* ---------- 2) música de combate: frenética, orquestral, ostinato de cordas e metais ---------- */
TDEF.combate={bpm:180,sw:0.56,key:'D',mode:'min',lead:'horn',harm:true,arp:'ostinato',pad:'strings',drums:'orch',hits:[0,3,6],hitsAlways:true,seed:401,lo:57,hi:81,dens:'busy',leadVol:0.088,rev:0.2,piano:false,
  bars:'Dm Dm Bb Bb Gm Gm A7 A7 Dm F C A7 Bb Gm A7 A7 Dm Dm Gm Gm Bb A7 Dm Dm'};
TDEF.combate2={bpm:190,sw:0.55,key:'E',mode:'min',lead:'trumpet',harm:true,arp:'ostinato',pad:'strings',drums:'rag',hits:[1,3,5,7],hitsAlways:true,seed:419,lo:62,hi:86,dens:'busy',leadVol:0.088,rev:0.16,piano:true,
  bars:'Em Em C C D D Bm B7 Em C D Bm Am B7 Em B7 Em G D Am C D B7 B7'};
const COMBAT={t:0,v:'combate'};
const CMB_FRAMES=600;
function combatPing(){
  if(G.bank||!R||R.cartMode)return;
  if(COMBAT.t<=0)COMBAT.v=Math.random()<0.5?'combate':'combate2';
  COMBAT.t=CMB_FRAMES;
}
const _roomTrack4=roomTrack;
const BOSSTRACKS={boss:1,carrasco:1,fboss:1,baron:1,baron3:1,briggs:1,briggs2:1,unk1:1,unk2:1,unk3:1,fuga:1,ponte:1,emboscada:1,escolta:1,prisao:1};
roomTrack=function(id){
  const r=_roomTrack4(id);
  if(COMBAT.t>0&&!BOSSTRACKS[r]&&!(G.bossFight)&&(!TDEF[r]||TDEF[r].bpm<156)&&!(R&&R.prison))return COMBAT.v;
  return r;
};
const _musicSync4=musicSync;
musicSync=function(){
  if(G.state==='play'&&COMBAT.t>0)COMBAT.t--;
  if(P&&P.dead)COMBAT.t=0;
  _musicSync4();
  if(Mus.name==='combate'||Mus.name==='combate2'){
    Mus.layer=(P&&P.hp<=2)?3:2;Mus.tempoMul=1+(COMBAT.t>CMB_FRAMES*0.5?0.03:0);
  }else if(R&&P&&Mus.want&&Mus.want===Mus.name&&TDEF[Mus.want]&&TDEF[Mus.want].drums&&TDEF[Mus.want].drums!=='none'&&!G.boss){
    /* quando há inimigos por perto, entram mais instrumentos */
    let near=false;for(const e of EN){if(!e.dead&&e.dmg&&Math.abs(e.x-P.x)<240&&Math.abs(e.y-P.y)<120){near=true;break;}}
    if(near&&Mus.layer<2)Mus.layer=2;
  }
};

/* gatilhos do combate: atirar num inimigo ou tomar dano */
const _dmgEnemy4=dmgEnemy;
dmgEnemy=function(e,d,bx){if(!e.noHit&&e.t!=='tnt'&&!e.thief0)combatPing();return _dmgEnemy4(e,d,bx);};
const _hurt4=hurtPlayer;
hurtPlayer=function(d,sx){const hp=P.hp;_hurt4(d,sx);if(P.hp<hp&&!P.dead)combatPing();};

/* ---------- 3) inimigos mais rápidos (menos os chefes) ---------- */
const NOFAST={boss:1,jacky:1,gghost:1,baron:1,briggs:1,unknown:1,brandon:1,brandon3:1,fpillar:1,fwave:1,rock:1,ecart:1,tnt:1};
let ENFAST=0.38,SLOWF=1;
Object.keys(AI).forEach(k=>{
  if(NOFAST[k])return;const f=AI[k];
  AI[k]=function(e){
    if(SLOWF<1&&!e.big&&!(R&&R.prison)){e._sk=(e._sk||0)+SLOWF;if(e._sk<1)return;e._sk-=1;}
    f(e);
    if(e.dead||P.dead||e.big||(R&&R.prison)||e.bankBoss)return;
    e._sa=(e._sa||0)+ENFAST;
    if(e._sa>=1){e._sa-=1;f(e);}
  };
});

/* ---------- 4) morte: explosão, revólver cai, dinheiro roubado ---------- */
let SPCOL=null;

  if(eagle){x.fillStyle='#efe2c0';x.fillRect(cx-1,by-Math.round(4*sc),Math.max(2,Math.round(3*sc)),Math.max(1,Math.round(2*sc)));x.fillStyle='#f0a838';x.fillRect(cx-1,by-Math.round(2*sc),1,1);}

      const t=i/L,yy=Math.round(by-ph*L*0.78*t*t+Math.sin(t*Math.PI)*L*0.14+t*t*L*0.1);
      const th=Math.max(1,Math.round((eagle?5:3)*sc*(1-t*0.55)));

const VULT={};
function vultSpr(fr,L){
  const key=fr+'_'+L;if(VULT[key])return VULT[key];
  const w=L*2+8,h=L+12,[c,x]=mk(w,h),cx=w>>1,by=Math.round(h*0.55),ph=[0,0.25,0.5,0.25,0,-0.2][fr%6];

  x.fillStyle=dk;x.fillRect(cx-1,by+2,3,3);x.fillRect(cx-2,by+5,5,2);
  x.fillRect(cx-1,by-2,3,5);

  /* asas largas, com as pontas das penas abertas em "dedos" */

const SLOT_IMG={};
function slotImg(sl){
  if(!sl.thumb)return null;
  let im=SLOT_IMG[sl.id];if(!im){im=new Image();im.src=sl.thumb;SLOT_IMG[sl.id]=im;}
  return im.complete&&im.naturalWidth?im:null;
}
function slotEntries(){
  const mode=G.slots.mode,out=[];
  if(mode==='save')out.push({kind:'new'});

  if(auto&&mode==='load'){const f=auto.flags||{};out.push({kind:'auto',data:auto,title:'FOGUEIRA (AUTOMÁTICO)',room:(auto.cp&&auto.cp.room)||'estrada',time:f.clock||0,coins:f.coins||0,ts:auto.ts||0});}

function slotsSaveTo(existingId){
  const c=G.camp,s=G.slots;
  const cp=c&&c.s?{room:R.id,x:c.s.x,y:c.s.y}:G.cp;
  const L=slotsLoad();
  const data={ver:3,flags:JSON.parse(JSON.stringify(G.flags)),visited:JSON.parse(JSON.stringify(G.visited)),cp,ts:Date.now(),thumb:G.snap||null};
  if(existingId){const k=L.findIndex(x=>x.id===existingId);data.id=existingId;data.name=k>=0?L[k].name:'SLOT';if(k>=0)L[k]=data;else L.push(data);}
  else{const mx=L.reduce((m,x)=>Math.max(m,x.n||0),0)+1;data.id='s'+Date.now().toString(36);data.n=mx;data.name='SLOT '+String(mx).padStart(2,'0');L.push(data);}

function updateSlots(){
  const s=G.slots;if(!s){G.state='play';return;}
  s.t++;if(s.toast>0)s.toast--;
  const n=s.list.length;
  if(s.conf){
    const cf=s.conf;
    if(pressed.Escape||mouse.rclick){s.conf=null;return;}
    if(pressed.KeyA||pressed.KeyD||pressed.ArrowLeft||pressed.ArrowRight){s.csel=1-s.csel;sfx('ui');}
    let pick=-1;
    for(let k=0;k<2;k++){const r={x:W/2-70+k*72,y:150,w:68,h:20};if(inR(r,mouse.x,mouse.y)){s.csel=k;if(mouse.click)pick=k;}}
    if(pressed.Enter||pressed.Space)pick=s.csel;
    if(pick===0){
      if(cf.type==='over'){s.conf=null;slotsSaveTo(cf.id);}
      else if(cf.type==='del'){const L=slotsLoad().filter(x=>x.id!==cf.id);slotsStore(L);s.conf=null;s.list=slotEntries();s.sel=Math.min(s.sel,Math.max(0,s.list.length-1));sfx('ui');}
    }else if(pick===1)s.conf=null;
    return;
  }
  if(pressed.Escape||mouse.rclick||(mouse.click&&inR(closeRect,mouse.x,mouse.y))){slotsBack();return;}
  if(n){
    if(pressed.KeyW||pressed.ArrowUp){s.sel=(s.sel+n-1)%n;sfx('ui');}
    if(pressed.KeyS||pressed.ArrowDown){s.sel=(s.sel+1)%n;sfx('ui');}
    if(mouse.wheel){s.sel=clamp(s.sel+(mouse.wheel>0?1:-1),0,n-1);}
  }
  const vis=3,target=Math.max(0,(s.sel-1)*50);s.scroll+=(target-s.scroll)*0.25;
  for(let i=0;i<n;i++){const r=slotRowRect(i);if(r.y>40&&r.y+r.h<H-20&&inR(r,mouse.x,mouse.y)){if(mouse.click){if(s.sel===i)slotsAct(i);s.sel=i;}}}
  if(n&&(pressed.Enter||pressed.Space||pressed.KeyE))slotsAct(s.sel);
  if(n&&(pressed.Delete||pressed.KeyX)){const e=s.list[s.sel];if(e&&e.kind==='slot'){s.conf={type:'del',id:e.slot.id};s.csel=1;sfx('ui');}}
}
function slotsAct(i){
  const s=G.slots,e=s.list[i];if(!e)return;

}

const _ROOM_MANSAO=ROOMS.mansao;
ROOMS.mansao=function(){
  const r=_ROOM_MANSAO();
  const g=r.g;
  /* remove as tábuas em zigue-zague */
  [45,42,39,36,33].forEach(y=>{for(let x=50;x<56;x++)if(g[y][x]==='=')g[y][x]='.';});
  [28,25,22,19,17].forEach(y=>{for(let x=8;x<14;x++)if(g[y][x]==='=')g[y][x]='.';});
  for(let x=18;x<24;x++)if(g[27][x]==='=')g[27][x]='.';
  /* buraco do 2º andar passa a começar em x=9 para a escada encostar no piso */
  g[15][8]='W';g[16][8]='W';
  /* escada 1: térreo -> 2º andar (sobe para a direita) */
  const stairs=[];
  for(let k=0;k<=16;k++){const tx=39+k,ty=47-k;g[ty][tx]='W';stairs.push([tx,ty,1]);}
  /* escada 2: 2º -> 3º andar (sobe para a esquerda) */
  for(let k=0;k<=15;k++){const tx=24-k,ty=30-k;g[ty][tx]='W';stairs.push([tx,ty,-1]);}
  r.stairs=stairs;
  /* móveis novos */
  const S=(x,row,kind,content,id)=>st(r,'search',x,{row,kind,content,id:'m_'+id});
  S(10,48,'barrel','coins','j');S(21,48,'vase','tape','k');S(28,48,'dresser','empty','l');S(38,48,'trunk','ammo','m');S(52,48,'barrel','ambush','n');S(57,48,'clock','coins','o');
  S(5,31,'vase','empty','p');S(12,31,'barrel','coins','q');S(27,31,'dresser','ammo','r');S(38,31,'trunk','ambush','s');S(46,31,'barrel','tape','t');
  S(4,15,'dresser','coins','u');S(17,15,'vase','empty','v');S(30,15,'barrel','ammo','w');S(51,15,'trunk','coins','x');S(40,15,'clock','empty','y');
  S(30,11,'crate','coins','z');S(50,11,'chest','ammo','aa');
  /* chave: um recipiente diferente a cada jogo novo */
  if(G.flags){
    if(G.flags.keySeed==null)G.flags.keySeed=rint(0,9999);
    const all=r.defs.filter(d=>d.t==='search');
    const old=all.find(d=>d.content==='key');
    const elig=all.filter(d=>d.content!=='ambush'&&!(G.flags.searched&&G.flags.searched[d.id])&&d!==old);
    if(old&&elig.length&&!(G.flags.keyitems&&G.flags.keyitems.key)){
      const pickd=elig[G.flags.keySeed%elig.length];
      old.content='coins';pickd.content='key';
    }
  }
  /* corrimãos e vigas desenhados no fundo */
  const dec=r.decor;
  r.decor=c=>{
    if(dec)dec(c);
    stairs.forEach(s=>{

function relicSpots(r){
  const out=[],sol=ch=>'#RWXL'.indexOf(ch)>=0,fy=FL(r);
  const avoid=r.defs.filter(d=>d.k==='st'&&['door','fire','shop','lock','cartstop','smith'].indexOf(d.t)>=0).map(d=>d.x/T);
  for(let y=3;y<r.h-1;y++)for(let x=3;x<r.w-3;x++){
    const c=r.g[y][x];
    const plat=c==='=',floor=(y===fy&&sol(c));

    if(r.g[y-1][x]!=='.'||r.g[y-2][x]!=='.'||r.g[y-3][x]!=='.')continue;

function opHero(t){
  const walkT=Math.min(t,OP_FALL0);

  }
  if(OP.up&&!OP.out){OP.upT++;if(OP.upT===140){OP.out=1;OP.skipT=0;}}
  if(OP.kick>0)OP.kick--;if(OP.scare>0)OP.scare--;

function opCape(ax,ay,t,wind,mode,gnd){
  const CB=['#7a1818','#8e2020','#a42a2a','#8e2020'],len=mode?44:40;
  for(let i=0;i<len;i++){
    const x=Math.round(ax-i),u=i/len;
    const wv=Math.sin(t*0.09-i*0.2)*wind,wv2=Math.sin(t*0.05-i*0.45+1)*wind;
    let top,bot;
    if(!mode){
      top=ay+i*0.22+wv*0.6-(i<3?(3-i)*1.5:0);
      bot=ay+34*(1-0.62*Math.pow(u,1.25))+i*0.42+wv*2.2+wv2*1.2;
    }else{
      const arch=Math.sin(Math.min(1,u*1.15)*Math.PI*0.9)*5;
      top=gnd-57+(1-Math.min(1,i/5))*3-arch*0.4+wv*0.25;
      bot=gnd-24+(u>0.7?(u-0.7)*22:0)+wv2*0.5;
    }
    /* barra esfiapada */
    const rag=((i*7+(i>>2)*3)%9<2)?3:((i*5)%7<2?1:0);
    bot-=rag;
    if(bot<=top+1)continue;
    const band=Math.floor((i+Math.sin(t*0.03)*1.5)/3)%4;
    rc(ctx,CB[(band+4)%4],x,top,1,bot-top);
    if(band===2)rc(ctx,'#5e1010',x,top+3,1,bot-top-3);           /* dobra escura */
    rc(ctx,'#c53a3a',x,top,1,1);                                  /* luz no topo */
    rc(ctx,'#3a0a0a',x,bot-1,1,1);                                /* barra escura */
    if(i%6===0)rc(ctx,'#a42a2a',x,top+(bot-top)*0.5,1,2);
  }
  /* gola e fecho dourado */
  rc(ctx,'#000',ax-1,ay-2,7,6);rc(ctx,'#a42a2a',ax,ay-1,5,4);rc(ctx,'#c53a3a',ax,ay-1,5,1);
  rc(ctx,'#000',ax+4,ay+1,4,4);rc(ctx,'#f0c040',ax+5,ay+2,2,2);
}

function raceStep(h,inp,Rc){
  const fin=h.fin>0;
  /* direção e velocidade */
  h.vy+=(fin?0:inp.dy)*0.38;h.vy*=0.8;h.vy=clamp(h.vy,-2.3,2.3);
  h.y=clamp(h.y+h.vy,RC_TOP,RC_BOT);

  else{h.st=Math.min(100,h.st+(h.lock>0?0.12:0.22));h.spr=false;}
  if(h.lock>0)h.lock--;
  if(h.stun>0){tgt=Math.min(tgt,0.9);h.stun--;}
  if(h.mud)tgt*=0.55;
  if(fin)tgt=0;
  h.sp+=(tgt-h.sp)*(fin?0.04:0.07);
  h.x+=h.sp;h.anim+=0.12+h.sp*0.1;
  if(h.hitT>0)h.hitT--;
  /* pulo */
  if(h.jt>0){h.jt++;if(h.jt>34)h.jt=0;}
  if(inp.jump&&h.jt===0&&!fin&&h.stun<20){h.jt=1;if(h===Rc.p)tone(420,0.1,'triangle',0.04,260,0);}
  const air=h.jt>0?Math.sin(h.jt/34*Math.PI)*14:0;h.air=air;
  /* obstáculos */
  h.mud=false;
  for(const o of Rc.obs){
    if(Math.abs(o.x-h.x)>60)continue;
    const dx=Math.abs(o.x-h.x),dy=Math.abs(o.y-h.y);
    if(o.k==='mud'){if((dx/o.rx)*(dx/o.rx)+(dy/o.ry)*(dy/o.ry)<1&&air<3)h.mud=true;continue;}
    if(h.hitT>0)continue;
    let hit=false;
    if(o.k==='log')hit=dx<10+o.r&&dy<5+o.h/2&&air<9;
    else if(o.k==='rock')hit=dx<10+o.r&&dy<5+o.r&&air<8;
    else hit=dx<10+o.r&&dy<5+o.r;
    if(hit){
      h.sp*=0.25;h.stun=44;h.hitT=36;h.vy=(h.y>=o.y?1:-1)*2.4;h.x-=4;

}
function raceAI(r,p,Rc){
  const inp={dy:0,jump:false,sprint:false,base:2.2*clamp(1+(p.x-r.x)/1300,0.94,1.07)};
  let threat=null;
  for(const o of Rc.obs){
    const d=o.x-r.x;if(d<6||d>90)continue;
    const half=o.k==='log'?o.h/2+5:(o.k==='mud'?o.ry+4:o.r+8);
    if(Math.abs(o.y-r.y)>half+10)continue;
    if(o.id%7===3)continue;                          /* erro humano: às vezes não vê */
    if(!threat||o.x<threat.x)threat=o;
  }
  if(threat){
    if((threat.k==='log'||threat.k==='rock')&&threat.x-r.x<30&&r.jt===0&&threat.id%2===0)inp.jump=true;
    else{
      const half=threat.k==='log'?threat.h/2+14:(threat.k==='mud'?threat.ry+12:threat.r+16);
      const up=threat.y-half,down=threat.y+half;
      r.ty=(r.y-up<down-r.y)?(up>RC_TOP+6?up:down):(down<RC_BOT-6?down:up);

  return inp;

  }
  for(const d of Rc.dust){d.x+=d.vx;d.y+=d.vy;d.l--;}

const P2P=(function(){

      const notify=()=>{const ch={peers:list()};listeners.forEach(f=>{try{f(ch);}catch(e){}});};
      const fanout=(msg,except)=>{for(const c of conns)if(c!==except&&c.open){try{c.send(msg);}catch(e){}}};

const LOAD={t:0,prog:0,ready:false,tip:0,tipT:0,steps:null};

function updateLoading(){
  LOAD.t++;LOAD.tipT++;

  if(LOAD.done<LOAD.steps.length&&LOAD.t%10===0){try{LOAD.steps[LOAD.done]();}catch(e){}LOAD.done++;}

  if(!LOAD.ready&&LOAD.done>=LOAD.steps.length&&LOAD.t>=200&&LOAD.prog>0.985){LOAD.ready=true;LOAD.prog=1;LOAD.rt=0;}
